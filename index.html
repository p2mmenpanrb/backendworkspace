<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Workspace Asdep PPP</title>
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--line:#e4e4e7;--text:#18181b;--muted:#71717a;
  --soft:#fafafa;--dark:#18181b;--green:#166534;--green-bg:#f0fdf4;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--amber:#92400e;--amber-bg:#fffbeb;
  --red:#b91c1c;--red-bg:#fef2f2;--purple:#6d28d9;--purple-bg:#f5f3ff
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.brand{padding:10px 10px 18px;font-weight:800;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px}
.nav{display:grid;gap:3px}
.nav button{border:0;background:transparent;border-radius:7px;padding:9px 10px;text-align:left;font-size:13px;color:#3f3f46}
.nav button:hover{background:#f4f4f5}
.nav button.active{background:#18181b;color:#fff}
.main{min-width:0;padding:20px 22px 40px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:24px;margin:0;line-height:1.2}
.subtitle{color:var(--muted);font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#18181b;padding:8px 11px;font-size:12px;font-weight:650}
.btn:hover{background:#f4f4f5}.btn.primary{background:#18181b;border-color:#18181b;color:#fff}.btn.danger{color:#b91c1c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:9px;background:#fff;padding:13px 14px;min-width:0}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat-value{font-size:24px;font-weight:800;margin-top:4px}.stat-note{font-size:10px;color:var(--muted);margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-title{font-size:14px;font-weight:750}.card-note{font-size:11px;color:var(--muted);margin-top:2px}
.card-body{padding:14px}.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:#fafafa;color:#71717a;font-size:11px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
td{font-size:12px;padding:10px;border-bottom:1px solid #f1f1f2;vertical-align:top}
tr:last-child td{border-bottom:0}
.sub{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;background:#fff;color:#52525b;white-space:nowrap}
.pill.todo{background:#fafafa}.pill.progress{background:var(--blue-bg);border-color:#dbeafe;color:var(--blue)}
.pill.done{background:var(--green-bg);border-color:#dcfce7;color:var(--green)}
.pill.high{background:var(--red-bg);border-color:#fecaca;color:var(--red)}
.pill.medium{background:var(--amber-bg);border-color:#fde68a;color:var(--amber)}
.pill.low{background:#f4f4f5}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(2,190px) auto;gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 10px;font-size:13px}
.field textarea{min-height:88px;resize:vertical}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:#52525b}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{padding:28px;text-align:center;color:#a1a1aa;font-size:12px}
.row-actions{display:flex;flex-wrap:wrap;gap:5px}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:10px;font-weight:650}
.mini.primary{background:#18181b;color:#fff;border-color:#18181b}.mini.danger{color:#b91c1c}
.loading{padding:50px;text-align:center;color:var(--muted)}
.error{padding:12px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:8px;margin-bottom:14px;font-size:12px}
.matrix{min-width:1000px}.matrix td.center,.matrix th.center{text-align:center}
.load{display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-weight:700}
.load.l0{background:#fafafa}.load.l1{background:#f0fdf4;color:#166534}.load.l2{background:#eff6ff;color:#1d4ed8}
.load.l3{background:#fffbeb;color:#92400e}.load.l4,.load.l5{background:#fef2f2;color:#b91c1c}
.load.leave-day{background:#f5f3ff;color:#6d28d9}.load.leave-conflict{background:#fef2f2;color:#b91c1c}
.task-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.task-column{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.task-column-head{padding:10px 12px;background:#fafafa;border-bottom:1px solid var(--line);font-size:12px;font-weight:750}
.task-card{padding:11px 12px;border-bottom:1px solid #f1f1f2}.task-card:last-child{border-bottom:0}
.task-title{font-size:12px;font-weight:750;line-height:1.4}.task-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.app-groups{display:grid;gap:14px}.app-group{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.app-group-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fafafa;border-bottom:1px solid var(--line)}
.app-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}
.app-card{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:185px;display:flex;flex-direction:column}
.app-icon{width:38px;height:38px;border-radius:8px;background:#18181b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
.app-name{font-size:13px;font-weight:750;margin-top:9px}.app-desc{font-size:11px;color:#52525b;line-height:1.5;margin-top:4px;flex:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(24,24,27,.34);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-backdrop.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.16)}
.modal-head,.modal-foot{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head{border-bottom:1px solid var(--line)}.modal-foot{border-top:1px solid var(--line)}
.modal-body{padding:15px}.modal-title{font-weight:800;font-size:15px}
.toast{position:fixed;right:18px;bottom:18px;background:#18181b;color:#fff;border-radius:8px;padding:10px 12px;font-size:12px;z-index:200;display:none;max-width:360px}
.toast.show{display:block}.toast.error-toast{background:#991b1b}
.mobile-nav{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.app-grid{grid-template-columns:repeat(2,1fr)}.task-columns{grid-template-columns:1fr}}
@media(max-width:760px){
  .app{display:block}.sidebar{display:none}.main{padding:14px 12px 75px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:80;overflow:auto}
  .mobile-nav button{border:0;background:#fff;padding:10px 12px;font-size:10px;white-space:nowrap}.mobile-nav button.active{font-weight:800;background:#f4f4f5}
  .stats,.grid2,.grid3,.form-grid,.toolbar,.app-grid{grid-template-columns:1fr}.topbar{flex-direction:column}.toolbar input,.toolbar select,.field input,.field select,.field textarea{font-size:16px}
}

.nav-group{margin-top:14px}.nav-group:first-child{margin-top:0}.nav-group-label{padding:0 10px;margin-bottom:5px;font-size:9px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:.05em}.nav-divider{height:1px;background:#f1f1f2;margin:12px 5px 2px}
.nav-group button{display:block;width:100%}
.brand-wrap{display:flex;gap:10px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand-mark{width:32px;height:32px;border-radius:8px;background:#18181b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}.brand-copy{font-weight:800;font-size:14px}.brand-copy small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px;line-height:1.45}
.project-link{display:inline-flex;border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:650}.project-list-head,.project-row{display:grid;grid-template-columns:minmax(240px,1.4fr) 150px 110px 150px 80px 90px;gap:10px;align-items:center}.project-list-head{padding:9px 13px;background:#fafafa;border-bottom:1px solid var(--line);font-size:10px;color:#71717a;font-weight:700}.project-row{padding:12px 13px;border-bottom:1px solid #f1f1f2}.project-row:last-child{border-bottom:0}.project-name{font-size:12px;font-weight:750}.project-desc{font-size:10px;color:var(--muted);line-height:1.45;margin-top:3px}.project-back{font-size:10px;color:#52525b;margin-bottom:7px;cursor:pointer}.project-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.project-health{display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:14px;font-size:10px;color:#52525b}.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.linked-item,.source-item,.timeline-item{padding:10px 12px;border-bottom:1px solid #f1f1f2}.linked-item:last-child,.source-item:last-child,.timeline-item:last-child{border-bottom:0}.linked-title{font-size:11px;font-weight:700}.timeline-top{display:flex;justify-content:space-between;gap:10px}.timeline-date{font-size:9px;color:var(--muted)}.timeline-text{font-size:10px;color:#52525b;line-height:1.5;margin-top:4px}.timeline-meta{font-size:9px;color:#a1a1aa;margin-top:4px}.timeline-tools{display:grid;grid-template-columns:minmax(180px,1fr) 150px;gap:7px}.timeline-tools input,.timeline-tools select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:10px;background:#fff}.agenda-active td{background:#f0fdf4}.agenda-active td:first-child{box-shadow:inset 3px 0 0 #166534}.agenda-next td{background:#fffbeb}.agenda-next td:first-child{box-shadow:inset 3px 0 0 #92400e}
.load.clickable{cursor:pointer;background:#fff}.load.clickable:hover{box-shadow:0 0 0 2px #e4e4e7}.load.clickable.l1{background:#f0fdf4}.load.clickable.l2{background:#eff6ff}.load.clickable.l3{background:#fffbeb}.load.clickable.l4,.load.clickable.l5{background:#fef2f2}
.helper{font-size:10px;color:var(--muted);line-height:1.45;margin-top:4px}
@media(max-width:1100px){.project-list-head,.project-row{grid-template-columns:minmax(220px,1.4fr) 135px 100px 135px 70px}.project-list-head>*:nth-child(6),.project-row>*:nth-child(6){display:none}.project-grid{grid-template-columns:1fr}}


/* Circular global loading indicator */
.global-progress{
  position:fixed;
  top:14px;
  right:16px;
  width:156px;
  min-height:31px;
  z-index:500;
  pointer-events:none;
  opacity:0;
  transform:translateY(-5px);
  border:1px solid #e4e4e7;
  border-radius:8px;
  background:rgba(255,255,255,.98);
  box-shadow:0 4px 14px rgba(24,24,27,.10);
  padding:6px 8px 8px;
  transition:opacity .14s ease,transform .14s ease;
}
.global-progress.show{
  opacity:1;
  transform:translateY(0);
}
.global-progress-copy{
  display:flex;
  align-items:center;
  gap:6px;
  height:12px;
  font-size:8.5px;
  line-height:1;
  font-weight:700;
  color:#52525b;
  white-space:nowrap;
}
.global-progress-dot{
  width:5px;
  height:5px;
  flex:0 0 5px;
  border-radius:999px;
  background:#dc2626;
}
.global-progress-track{
  position:absolute;
  left:8px;
  right:8px;
  bottom:5px;
  height:3px;
  overflow:hidden;
  border-radius:999px;
  background:#fee2e2;
}
.global-progress-bar{
  width:0;
  height:100%;
  border-radius:999px;
  background:#dc2626;
  transition:width 1.6s cubic-bezier(.22,.61,.36,1);
}
.global-progress.complete .global-progress-bar{
  transition-duration:.16s;
}
.global-progress.complete .global-progress-copy{
  color:#991b1b;
}
@media(max-width:600px){
  .global-progress{
    top:10px;
    right:10px;
    width:132px;
  }
}
@media(prefers-reduced-motion:reduce){
  .global-progress,
  .global-progress-bar{
    transition-duration:.01ms !important;
  }
}


/* Agenda day switcher */
.agenda-switch{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fafafa;
}
.agenda-switch button{
  border:0;
  background:transparent;
  border-radius:6px;
  padding:6px 10px;
  font-size:10.5px;
  font-weight:650;
  color:#71717a;
}
.agenda-switch button:hover{
  background:#f4f4f5;
  color:#18181b;
}
.agenda-switch button.active{
  background:#fff;
  color:#18181b;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.agenda-all-day{
  font-weight:650;
  color:#4338ca;
}


/* Previous Tren Pekerjaan visual restored */
.trend-segmented{
  display:flex;gap:3px;padding:3px;border:1px solid var(--line);
  border-radius:8px;background:#fff;flex-wrap:wrap
}
.trend-segmented button{
  border:0;border-radius:6px;background:transparent;padding:7px 10px;
  font-size:10.5px;color:#52525b
}
.trend-segmented button.active{background:#18181b;color:#fff}
.trend-volume-card{margin-bottom:14px}
.trend-chart-card{min-height:320px}
.trend-legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.trend-legend-item{display:flex;align-items:center;gap:5px}
.trend-legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.trend-legend-dot.incoming{background:#18181b}
.trend-legend-dot.completed{background:#bfdbfe}
.trend-chart-scroll{overflow-x:auto}
.trend-volume-chart{

}
.trend-month-group{
  flex:1;min-width:44px;height:210px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end
}
.trend-bar-pair{
  width:100%;height:180px;display:flex;justify-content:center;align-items:flex-end;gap:4px
}
.trend-bar{width:36%;min-height:2px;border-radius:5px 5px 2px 2px}
.trend-bar.incoming{background:#18181b}
.trend-bar.completed{background:#bfdbfe}
.trend-month-label{font-size:10px;color:var(--muted);margin-top:7px;white-space:nowrap}
.trend-grid{

.trend-team-card{margin-bottom:14px}

/* v1.52 — aligned PIC selector */
.pic-selector{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px 9px;
  margin-top:2px;
}
.pic-option{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:36px;
  padding:7px 9px;
  border:1px solid #e4e4e7;
  border-radius:7px;
  background:#fff;
  font-size:11px;
  line-height:1.35;
  font-weight:500 !important;
  color:#3f3f46;
  cursor:pointer;
  user-select:none;
  transition:border-color .12s ease,background .12s ease;
}
.pic-option:hover{
  background:#fafafa;
  border-color:#d4d4d8;
}
.pic-option input[type="checkbox"]{

}
.pic-selector-note{

  font-size:9.5px;
  line-height:1.45;
  color:#a1a1aa;
}
@media(max-width:760px){

}

}

/* v1.56 — Project architecture: Aktivitas umbrella + Riwayat Sistem */
.project-tabs{
  display:inline-flex;gap:4px;padding:4px;margin:14px 0;
  border:1px solid var(--line);border-radius:9px;background:#fafafa
}
.project-tabs button{
  border:0;background:transparent;border-radius:7px;padding:7px 11px;
  font-size:10.5px;font-weight:650;color:#71717a;cursor:pointer
}
.project-tabs button.active{background:#18181b;color:#fff}
.activity-list{display:grid;gap:10px}
.activity-card{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.activity-card-main{
  display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;
  align-items:start;padding:14px 15px
}
.activity-date{font-size:10px;line-height:1.45;color:#71717a}
.activity-type{
  display:inline-flex;align-items:center;margin-bottom:6px;padding:3px 7px;

}
.activity-title{font-size:12.5px;line-height:1.45;font-weight:750;color:#18181b}
.activity-note{margin-top:4px;font-size:10px;line-height:1.5;color:#71717a}
.activity-owner{margin-top:7px;font-size:9.5px;color:#71717a}
.activity-metrics{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.activity-metric{
  display:inline-flex;align-items:center;gap:4px;padding:4px 7px;
  border:1px solid #e4e4e7;border-radius:6px;background:#fafafa;font-size:9px;color:#52525b
}
.activity-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.activity-card-system{
  background:#fcfcfd;border-top:1px solid #f0f0f1;padding:8px 15px;
  font-size:9px;line-height:1.45;color:#a1a1aa
}
.activity-detail-section{margin-top:14px}
.activity-detail-section-title{
  margin-bottom:7px;font-size:10px;font-weight:750;text-transform:uppercase;
  letter-spacing:.04em;color:#71717a
}
.activity-linked-list{display:grid;gap:6px}
.activity-linked-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:9px 10px;border:1px solid #e7e7e9;border-radius:8px;background:#fff
}
.activity-linked-main{min-width:0}
.activity-linked-name{font-size:10.5px;line-height:1.4;font-weight:650;color:#18181b}
.activity-linked-meta{margin-top:2px;font-size:9px;line-height:1.4;color:#71717a}
.system-history-list{display:grid}
.system-history-row{
  display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;

}
.system-history-row:last-child{border-bottom:0}
.system-history-date{font-size:9.5px;color:#71717a;line-height:1.5}
.system-history-title{font-size:10.5px;font-weight:700;color:#18181b}
.system-history-text{margin-top:3px;font-size:9.5px;line-height:1.45;color:#71717a}
.system-history-meta{margin-top:4px;font-size:8.5px;color:#a1a1aa}
.activity-empty{padding:28px 16px;text-align:center;font-size:10px;color:#a1a1aa}

  .activity-card-main{grid-template-columns:1fr}
  .activity-actions{justify-content:flex-start}
  .system-history-row{grid-template-columns:1fr}
}


/* v1.57 — Project → Tahapan → Tugas */
.project-stage-list{display:grid;gap:11px;margin-top:12px}
.project-stage{
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  overflow:hidden;
}
.project-stage-head{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  padding:12px 13px;
}
.project-stage-no{
  width:29px;height:29px;display:grid;place-items:center;
  border-radius:7px;background:#f4f4f5;font-size:9px;font-weight:800
}
.project-stage-name{font-size:11.5px;font-weight:800}
.project-stage-meta{font-size:9px;color:var(--muted);margin-top:3px}
.project-stage-counts{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap}
.project-stage-body{border-top:1px solid #f1f1f2;padding:8px 13px 12px}
.project-task-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #f2f2f3
}
.project-task-row:last-child{border-bottom:0}
.project-task-title{font-size:10.5px;font-weight:750}
.project-task-description{font-size:9px;color:var(--muted);line-height:1.45;margin-top:3px}
.project-task-highlight{outline:2px solid #18181b;outline-offset:-2px;border-radius:7px}
.system-history-compact{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.system-history-compact summary{padding:11px 13px;font-size:9.5px;font-weight:750;cursor:pointer}
.system-history-row{
  display:grid;grid-template-columns:130px minmax(0,1fr) auto;
  gap:10px;padding:9px 13px;border-top:1px solid #f3f3f4
}
.system-history-date{font-size:8.5px;color:var(--muted)}
.system-history-title{font-size:9.5px;font-weight:700}
.system-history-text{font-size:8.5px;color:var(--muted);margin-top:2px;line-height:1.4}

.task-context{
  display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px;
  font-size:8.5px;color:#52525b
}
.task-context button{
  border:0;background:transparent;padding:0;font:inherit;color:#52525b;
  text-decoration:underline;text-underline-offset:2px;cursor:pointer
}
.task-update-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.task-update-option{
  text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:11px 10px;cursor:pointer
}
.task-update-option:hover{background:#fafafa}
.task-update-option.active{border-color:#18181b;box-shadow:0 0 0 1px #18181b inset}
.task-update-name{font-size:10px;font-weight:750}
.task-update-note{font-size:8.5px;color:var(--muted);line-height:1.35;margin-top:3px}

.task-detail-edit-row{display:flex;justify-content:flex-end;margin-bottom:7px}
.task-detail-edit{
  width:30px;height:30px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer
}
.task-detail-value{
  min-height:35px;border:1px solid var(--line);border-radius:7px;
  background:#fafafa;padding:8px 9px;font-size:10px;line-height:1.45
}
.task-detail-value.long{min-height:68px}

.my-task-list{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.my-task-row{

}

.my-task-when{font-size:8.5px;color:var(--muted);line-height:1.4}
.my-task-title{font-size:10px;font-weight:750}
.my-task-meta{font-size:8.5px;color:var(--muted);margin-top:3px}
.my-task-status{
  width:100%;height:28px;border:1px solid var(--line);border-radius:6px;
  padding:0 6px;background:#fff;font-size:8.2px
}
.my-task-status.progress{background:#fffdf3;border-color:#ead58a}
.my-task-status.done{background:#f7faf7;border-color:#cfdccc}

.complete-task-name{font-size:9.5px;color:var(--muted);margin:-3px 0 14px}
.complete-attachments{

}
.complete-tabs{display:flex;gap:5px;margin-bottom:9px}
.complete-tab{
  border:1px solid var(--line);background:#fff;border-radius:6px;
  padding:5px 8px;font-size:8.5px;font-weight:700;cursor:pointer
}
.complete-tab.active{background:#18181b;color:#fff;border-color:#18181b}
.complete-required{font-size:8px;color:#b42318;margin-top:4px}

@media(max-width:760px){
  .project-stage-head{grid-template-columns:38px minmax(0,1fr)}
  .project-stage-counts{grid-column:2;justify-content:flex-start}
  .project-task-row{grid-template-columns:1fr}
  .task-update-grid{grid-template-columns:1fr}
  .my-task-row{grid-template-columns:1fr}
  .system-history-row{grid-template-columns:1fr}
}


/* v1.64 — Kelola Tugas grouped sections + independent pagination */
.task-scorecards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 14px}
.task-scorecard{border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 12px}

.task-score-note{font-size:8px;color:#a1a1aa;margin-top:2px}
.task-scorecard.needs-update{border-color:#fecaca;background:#fffafa}
.task-scorecard.needs-update .task-score-value{color:#b91c1c}
.task-sections{display:grid;gap:14px}
.task-section{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.task-section-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;border-bottom:1px solid var(--line);background:#fafafa
}

.task-section-note{font-size:8.5px;color:#71717a;margin-top:2px}

  padding:0 7px;border:1px solid var(--line);border-radius:999px;background:#fff;
  font-size:8.5px;font-weight:700;color:#52525b
}
.task-section.update .task-section-head{background:#fffafa}
.task-section.update .task-section-count{border-color:#fecaca;color:#b91c1c;background:#fff}

.task-row-head,.task-list-row{

  grid-template-columns:42px minmax(340px,1fr) 145px minmax(150px,.72fr) minmax(300px,auto);
  gap:12px;align-items:center
}
.task-row-head{
  min-height:35px;padding:0 12px;border-bottom:1px solid var(--line);
  background:#fff;font-size:8px;font-weight:750;color:#71717a;
  text-transform:uppercase;letter-spacing:.035em

.task-list-row:last-child{border-bottom:0}

.task-list-title{font-size:10.5px;font-weight:750;line-height:1.4}
.task-list-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:5px}
.task-list-context{font-size:8px;color:#71717a;line-height:1.4;margin-top:4px}
.task-list-context button{
  border:0;background:transparent;padding:0;font:inherit;color:#52525b;
  cursor:pointer;text-decoration:underline;text-underline-offset:2px

<script>
/*
  Netlify frontend v1.65 — refined Project UI + automatic proportional Gantt.
  Netlify frontend.
  Recommended production setup:
  - index.html is hosted by Netlify/GitHub
  - POST /api is proxied by a Netlify Function to Apps Script
  - Code.gs above is deployed as Apps Script Web App backend

  If you already have your own proxy endpoint, change API_ENDPOINT below.
*/
const API_ENDPOINT = '/api';


let __activeRequests=0;
let __globalProgressHideTimer=null;

function startGlobalProgress(){
  __activeRequests++;
  if(__activeRequests!==1)return;

  const shell=document.getElementById('globalProgress');
  const bar=document.getElementById('globalProgressBar');
  const text=document.getElementById('globalProgressText');

  if(__globalProgressHideTimer){
    clearTimeout(__globalProgressHideTimer);
    __globalProgressHideTimer=null;
  }

  if(!shell)return;

  shell.classList.remove('complete');
  shell.classList.add('show');
  shell.setAttribute('aria-hidden','false');

  if(text)text.textContent='Memuat…';

  if(bar){
    bar.style.transition='none';
    bar.style.width='10%';

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        bar.style.transition='width 1.6s cubic-bezier(.22,.61,.36,1)';
        bar.style.width='76%';
      });
    });
  }
}

function finishGlobalProgress(){
  __activeRequests=Math.max(0,__activeRequests-1);
  if(__activeRequests>0)return;

  const shell=document.getElementById('globalProgress');
  const bar=document.getElementById('globalProgressBar');
  const text=document.getElementById('globalProgressText');

  if(!shell)return;

  shell.classList.add('complete');
  if(text)text.textContent='Selesai';
  if(bar)bar.style.width='100%';

  __globalProgressHideTimer=setTimeout(()=>{
    shell.classList.remove('show','complete');
    shell.setAttribute('aria-hidden','true');

    if(bar){
      bar.style.transition='none';
      bar.style.width='0';
    }

    if(text)text.textContent='Memuat…';
  },420);
}

const __nativeFetch=window.fetch.bind(window);
window.fetch=async function(){
  startGlobalProgress();
  try{
    return await __nativeFetch(...arguments);
  }finally{
    finishGlobalProgress();
  }
};


const PAGES=[
  ['workload','Ringkasan Pekerjaan','Monitoring'],
  ['trend','Tren Pekerjaan','Monitoring'],
  ['project','Project','Pekerjaan'],
  ['taskmatrix','Kelola Tugas','Pekerjaan'],
  ['taskrecap','Tugas Saya','Pekerjaan'],
  ['documents','Dokumen','Referensi & Koordinasi'],
  ['pics','PIC & Kontak Instansi','Referensi & Koordinasi'],
  ['blast','Blast & Komunikasi','Referensi & Koordinasi'],
  ['apps','Aplikasi Tim','Tools']
];

const state={
  page:new URLSearchParams(location.search).get('page')||'workload',
  model:null,
  bootstrap:null,
  week:'',
  trendFilters:{period:'year',program:'',activity:''},
  projectId:new URLSearchParams(location.search).get('project')||'',
  taskStageFilter:'',
  projectStageFocus:'',
  projectTaskFocus:'',
  recapPic:'',
  taskListPage:1,
  taskSectionPages:{todo:1,progress:1,done:1,update:1},
  projectTimeline:{q:'',type:'',limit:20}
};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function j(v){try{return JSON.parse(v||'[]')}catch(_){return[]}}
function qs(sel,root=document){return root.querySelector(sel)}
function qsa(sel,root=document){return [...root.querySelectorAll(sel)]}
function statusLabel(s){return s==='done'?'Selesai':s==='progress'?'Sedang Dikerjakan':'Perlu Dikerjakan'}
function priorityClass(p){return p==='Tinggi'?'high':p==='Rendah'?'low':'medium'}
function fmtDate(v){if(!v)return'—';const d=new Date(v.length===10?v+'T00:00:00':v);return isNaN(d)?v:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function showToast(msg,error=false){const t=qs('#toast');t.textContent=msg;t.className='toast show'+(error?' error-toast':'');setTimeout(()=>t.className='toast',2800)}
function setError(msg=''){qs('#errorBox').innerHTML=msg?`<div class="error">${esc(msg)}</div>`:''}

async function api(action,payload={}){
  const READ_ACTIONS=new Set([
    'bootstrap',
    'initial',
    'getPage',
    'taskDetail',
    'projectAssets',
    'projectDocuments',
    'projectSources',
    'projectHistory'
  ]);

  if(READ_ACTIONS.has(action)){
    const params=new URLSearchParams();
    params.set('action',action);

    Object.entries(payload||{}).forEach(([key,value])=>{
      if(value===undefined||value===null||value==='') return;
      params.set(key,String(value));
    });

    // Sheets-backed reads must always be fresh after a write.
    // A cache-buster also protects against intermediary/proxy caching.
    params.set('_ts',String(Date.now()));

    const res=await fetch(
      API_ENDPOINT+'?'+params.toString(),
      {
        method:'GET',
        cache:'no-store',
        headers:{
          'Accept':'application/json',
          'Cache-Control':'no-cache'
        }
      }
    );

    const text=await res.text();
    let out;

    try{
      out=JSON.parse(text);
    }catch(_){
      throw new Error(
        'API tidak mengembalikan JSON.'
      );
    }

    if(!res.ok){
      throw new Error(
        out.error||('HTTP '+res.status)
      );
    }

    if(!out.success){
      throw new Error(
        out.error||'Terjadi kesalahan.'
      );
    }

    return out.data;
  }

  const res=await fetch(API_ENDPOINT,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Accept':'application/json'
    },
    body:JSON.stringify({
      action,
      payload
    })
  });

  const text=await res.text();
  let out;

  try{
    out=JSON.parse(text);
  }catch(_){
    throw new Error(
      'API tidak mengembalikan JSON.'
    );
  }

  if(!res.ok){
    throw new Error(
      out.error||('HTTP '+res.status)
    );
  }

  if(!out.success){
    throw new Error(
      out.error||'Terjadi kesalahan.'
    );
  }

  return out.data;
}

function buildNav(){
  const groups=['Monitoring','Pekerjaan','Referensi & Koordinasi','Tools'];
  const html=groups.map((group,gi)=>{
    const items=PAGES.filter(x=>x[2]===group);
    return `${gi?'<div class="nav-divider"></div>':''}<div class="nav-group"><div class="nav-group-label">${esc(group)}</div>${items.map(([key,label])=>`<button class="${state.page===key?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('')}</div>`;
  }).join('');
  qs('#nav').innerHTML=html;
  qs('#mobileNav').innerHTML=PAGES.map(([key,label])=>`<button class="${state.page===key?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('');
}

let __pageRequestSequence=0;

function commitPageUrl(page,projectId,mode='push'){
  if(mode==='none')return;

  const url=new URL(location.href);
  url.searchParams.set('page',page);

  if(projectId){
    url.searchParams.set('project',projectId);
  }else{
    url.searchParams.delete('project');
  }

  history[
    mode==='replace'
      ? 'replaceState'
      : 'pushState'
  ]({},'',url);
}

function navigate(page,replace=false){
  if(!page)return;

  setError('');

  return loadPage({
    targetPage:page,
    targetProjectId:'',
    commitNavigation:true,
    historyMode:replace?'replace':'push'
  });
}

window.addEventListener('popstate',()=>{
  const p=new URLSearchParams(location.search);

  loadPage({
    targetPage:p.get('page')||'workload',
    targetProjectId:p.get('project')||'',
    commitNavigation:true,
    historyMode:'none'
  });
});

async function loadPage(extra={}){
  const requestId=++__pageRequestSequence;

  const targetPage=
    extra.targetPage!==undefined
      ? extra.targetPage
      : state.page;

  const targetProjectId=
    extra.targetProjectId!==undefined
      ? extra.targetProjectId
      : (
          extra.projectId!==undefined
            ? extra.projectId
            : state.projectId
        );

  const targetWeek=
    extra.week!==undefined
      ? extra.week
      : state.week;

  try{
    const nextModel=await api('getPage',{
      page:targetPage,
      week:targetWeek,
      blastId:extra.blastId||'',
      projectId:targetProjectId
    });

    // Ignore an older response if the user clicked another module
    // while this request was still running.
    if(requestId!==__pageRequestSequence)return;

    state.page=targetPage;
    state.projectId=targetProjectId;
    state.model=nextModel;

    if(
      state.page==='workload' &&
      state.model.workload
    ){
      state.week=
        state.model.workload.weekKey||targetWeek||'';
    }

    if(extra.commitNavigation){
      commitPageUrl(
        state.page,
        state.projectId,
        extra.historyMode||'push'
      );
    }

    buildNav();
    renderCurrent();
  }catch(err){
    if(requestId!==__pageRequestSequence)return;

    // Keep the existing module visible. The user only sees the
    // top progress bar while loading; an error message is shown
    // without replacing the current page.
    setError(err.message);
  }
}

function renderCurrent(){
  const map={

function trendIsoDate(value){
  const raw=String(value||'').trim();
  if(!raw)return'';
  const m=raw.match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:'';
}
function trendCreatedDate(task){
  return trendIsoDate(task.createdAt)||trendIsoDate(task.startDate)||trendIsoDate(task.endDate)||trendIsoDate(task.due)||trendIsoDate(task.updatedAt);
}
function trendCompletedDate(task){
  const explicit=trendIsoDate(task.completedAt);
  if(explicit)return explicit;
  if(task.status!=='done')return'';
  return trendIsoDate(task.endDate)||trendIsoDate(task.startDate)||trendIsoDate(task.due)||trendIsoDate(task.updatedAt);
}
function trendDateFromKey(key){
  const p=String(key||'').split('-').map(Number);
  return p.length===3&&!p.some(Number.isNaN)?new Date(p[0],p[1]-1,p[2]):null;
}
function trendMonthKey(date){
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');
}
function trendMonthLabel(key,includeYear){
  const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const p=String(key).split('-').map(Number);
  if(p.length!==2)return key;
  return months[p[1]-1]+(includeYear?' '+String(p[0]).slice(-2):'');
}
function trendTasks(){
  return j(state.model.trendWork?.tasksJson);
}
function trendFilteredTasks(){
  const f=state.trendFilters;
  return trendTasks().filter(t=>
    (!f.program||t.program===f.program)&&
    (!f.activity||t.substansi===f.activity)
  );
}
function trendMonthKeys(){
  const tasks=trendTasks();
  const today=new Date();
  const year=today.getFullYear(),month=today.getMonth();
  const period=state.trendFilters.period||'year';

  if(period==='3'||period==='6'){
    const n=Number(period),keys=[];
    for(let i=n-1;i>=0;i--)keys.push(trendMonthKey(new Date(year,month-i,1)));
    return keys;
  }
  if(period==='year'){
    return Array.from({length:month+1},(_,i)=>trendMonthKey(new Date(year,i,1)));
  }

  const dates=[];
  tasks.forEach(t=>{
    const a=trendCreatedDate(t),b=trendCompletedDate(t);
    if(a)dates.push(a);if(b)dates.push(b);
  });
  if(!dates.length)return[trendMonthKey(new Date(year,month,1))];
  dates.sort();
  const first=trendDateFromKey(dates[0]);
  if(!first)return[trendMonthKey(new Date(year,month,1))];

  const keys=[];
  let cursor=new Date(first.getFullYear(),first.getMonth(),1);
  const limit=new Date(year,month,1);
  while(cursor<=limit){
    keys.push(trendMonthKey(cursor));
    cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
  }
  return keys;
}

function trendBuildBuckets(tasks,keys){
  const map={};
  keys.forEach(k=>map[k]={key:k,incoming:0,completed:0});
  tasks.forEach(t=>{
    const a=trendCreatedDate(t),b=trendCompletedDate(t);
    if(a&&map[a.slice(0,7)])map[a.slice(0,7)].incoming++;
    if(b&&map[b.slice(0,7)])map[b.slice(0,7)].completed++;
  });
  return keys.map(k=>map[k]);
}
function trendTimeliness(task){
  if(!task||task.status!=='done')return null;
  const completed=trendIsoDate(task.completedAt);
  const deadline=trendIsoDate(task.endDate||task.startDate||task.due);
  if(!completed||!deadline)return null;
  return completed<=deadline;
}

function renderTrendDashboard(){
  const tasks=trendFilteredTasks();
  const keys=trendMonthKeys();
  const buckets=trendBuildBuckets(tasks,keys);
  const keySet=new Set(keys);

  const incoming=tasks.filter(t=>{const d=trendCreatedDate(t);return d&&keySet.has(d.slice(0,7))});
  const completed=tasks.filter(t=>{const d=trendCompletedDate(t);return d&&keySet.has(d.slice(0,7))});
  const overdue=incoming.filter(t=>!!t.overdue).length;
  const timed=completed.map(trendTimeliness).filter(v=>v!==null);
  const ontime=timed.filter(Boolean).length;

  qs('#trendTotalIncoming').textContent=incoming.length;
  qs('#trendTotalCompleted').textContent=completed.length;
  qs('#trendOverdue').textContent=overdue;
  qs('#trendOnTimeRate').textContent=timed.length?Math.round(ontime/timed.length*100)+'%':'—';
  qs('#trendOnTimeNote').textContent=timed.length?ontime+' dari '+timed.length+' tugas selesai tepat waktu':'Belum ada tugas selesai dengan target dan waktu selesai tercatat';

  renderTrendVolume(buckets);
  renderTrendMonthlyComposition('trendProgramMonthly','trendProgramLegend',incoming,keys,'program',state.bootstrap?.programs||[],TREND_PROGRAM_COLORS);
  renderTrendMonthlyComposition('trendActivityMonthly','trendActivityLegend',incoming,keys,'substansi',state.bootstrap?.activities||[],TREND_ACTIVITY_COLORS);
  renderTrendTeamHeatmap(tasks,keys);
}

function renderTrendVolume(buckets){
  const el=qs('#trendVolumeChart');
  if(!el)return;
  if(!buckets.length){el.innerHTML='<div class="empty">Belum ada data historis.</div>';return}
  const max=Math.max(1,...buckets.map(x=>Math.max(x.incoming,x.completed)));
  const years=new Set(buckets.map(x=>x.key.slice(0,4))),includeYear=years.size>1;
  el.style.minWidth=Math.max(620,buckets.length*64)+'px';
  el.innerHTML=buckets.map(x=>{
    const a=x.incoming?Math.max(4,x.incoming/max*100):1;
    const b=x.completed?Math.max(4,x.completed/max*100):1;
    return `<div class="trend-month-group"><div class="trend-bar-pair"><div class="trend-bar incoming" title="${x.incoming} tugas masuk" style="height:${a}%"></div><div class="trend-bar completed" title="${x.completed} tugas selesai" style="height:${b}%"></div></div><div class="trend-month-label">${trendMonthLabel(x.key,includeYear)}</div></div>`;
  }).join('');
}

function renderTrendMonthlyComposition(elementId,legendId,tasks,keys,field,master,colors){
  const el=qs('#'+elementId),legend=qs('#'+legendId);
  if(!el||!legend)return;
  const years=new Set(keys.map(k=>k.slice(0,4))),includeYear=years.size>1;
  const order=[...master,'Lain-lain','Belum Diklasifikasikan'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  const rows=keys.map(key=>{
    const monthTasks=tasks.filter(t=>{const d=trendCreatedDate(t);return d&&d.slice(0,7)===key});
    const counts={};
    monthTasks.forEach(t=>{const v=t[field]||'Belum Diklasifikasikan';counts[v]=(counts[v]||0)+1});
    return{key,total:monthTasks.length,counts};
  });
  if(!rows.some(r=>r.total)){el.innerHTML='<div class="empty">Belum ada data komposisi pada periode ini.</div>';legend.innerHTML='';return}

  el.innerHTML=rows.map(r=>{
    const segments=order.map(name=>{
      const count=r.counts[name]||0;if(!count||!r.total)return'';
      const pct=count/r.total*100;
      return `<span class="trend-stack-segment" style="width:${pct.toFixed(2)}%;background:${colors[name]||'#a1a1aa'}" title="${esc(name)}: ${count} tugas (${Math.round(pct)}%)"></span>`;
    }).join('');
    return `<div class="trend-month-row"><div class="trend-month-row-label">${trendMonthLabel(r.key,includeYear)}</div><div class="trend-stack">${segments}</div><div class="trend-month-row-total">${r.total||'—'}</div></div>`;
  }).join('');

  const present=order.filter(name=>rows.some(r=>r.counts[name]));
  legend.innerHTML=present.map(name=>`<span class="trend-monthly-legend-item"><span class="trend-monthly-swatch" style="background:${colors[name]||'#a1a1aa'}"></span>${esc(name)}</span>`).join('');
}

function setTrendTeamMetric(metric){
  TREND_TEAM_METRIC=metric;
  renderTrend();
}
function trendTaskDeadline(task){
  return trendIsoDate(task.endDate||task.startDate||task.due);
}
function trendLateAnchorDate(task){
  const deadline=trendTaskDeadline(task);
  if(!deadline)return'';
  const completed=trendIsoDate(task.completedAt);
  if(completed)return completed>deadline?deadline:'';
  const today=new Date().toISOString().slice(0,10);
  return task.status!=='done'&&deadline<today?deadline:'';
}
function trendMetricAnchorDate(task,metric){
  if(metric==='completed')return trendCompletedDate(task);
  if(metric==='late')return trendLateAnchorDate(task);
  return trendCreatedDate(task);
}
function trendMetricLabel(metric){
  return metric==='completed'?'Selesai':metric==='late'?'Terlambat':'Penugasan';
}
function trendHeatLevel(value,max){
  if(!value||!max)return 0;
  const r=value/max;
  return r<=.25?1:r<=.5?2:r<=.75?3:4;
}
function renderTrendTeamHeatmap(tasks,keys){
  const el=qs('#trendTeamHeatmap');
  if(!el)return;
  if(!keys.length){el.innerHTML='<div class="empty">Belum ada data historis.</div>';return}
  const team=state.bootstrap?.pics||[];
  const years=new Set(keys.map(k=>k.slice(0,4))),includeYear=years.size>1;
  const rows=team.map(name=>{
    const months=keys.map(key=>{
      let count=0;
      tasks.forEach(t=>{
        if(!(t.picList||[]).includes(name))return;
        const d=trendMetricAnchorDate(t,TREND_TEAM_METRIC);
        if(d&&d.slice(0,7)===key)count++;
      });
      return{key,count};
    });
    return{name,months,total:months.reduce((s,x)=>s+x.count,0)};
  });
  let max=0;rows.forEach(r=>r.months.forEach(x=>{if(x.count>max)max=x.count}));
  const header=`<div class="trend-team-grid trend-team-header"><div class="trend-team-name-head">Anggota Tim</div>${keys.map(k=>`<div class="trend-team-month-head">${trendMonthLabel(k,includeYear)}</div>`).join('')}<div class="trend-team-total-head">Total</div></div>`;
  const body=rows.map(r=>`<div class="trend-team-grid trend-team-row"><div class="trend-team-name">${esc(r.name)}</div>${r.months.map(x=>`<div class="trend-team-cell heat-${trendHeatLevel(x.count,max)}" title="${esc(r.name)} · ${trendMonthLabel(x.key,includeYear)} · ${trendMetricLabel(TREND_TEAM_METRIC)}: ${x.count}">${x.count}</div>`).join('')}<div class="trend-team-total">${r.total}</div></div>`).join('');
  el.style.minWidth=Math.max(760,160+keys.length*58+65)+'px';
  el.style.setProperty('--trend-month-count',String(keys.length));
  el.innerHTML=header+body;
}

function buildProjectGantt(project,stages,tasks,mode='all'){
  const DAY_WIDTH=10;
  const MS_DAY=24*60*60*1000;

  const toDate=value=>{
    if(!value)return null;
    const d=new Date(String(value).slice(0,10)+'T00:00:00');
    return Number.isNaN(d.getTime())?null:d;
  };

  const iso=d=>{
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };

  const rows=[];

  (stages||[])
    .slice()
    .sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0))
    .forEach((stage,index)=>{
      const start=toDate(stage.startDate);
      const end=toDate(stage.targetDate||stage.startDate);

      if(start&&end){
        rows.push({
          type:'stage',
          title:`${String(index+1).padStart(2,'0')} ${stage.name||'Tahapan'}`,
          start:iso(start),
          end:iso(end),
          status:'stage'
        });
      }

      (tasks||[])
        .filter(t=>String(t.stageId||'')===String(stage.id||''))
        .forEach(t=>{
          const ts=toDate(t.startDate);
          const te=toDate(t.endDate||t.startDate);

          if(!ts||!te)return;

          rows.push({
            type:'task',
            title:t.title||'Tugas',
            start:iso(ts),
            end:iso(te),
            status:t.status==='done'?'done':(t.overdue?'late':'active')
          });
        });
    });

  // Project tasks without a Tahapan are still included when dated.
  (tasks||[])
    .filter(t=>!t.stageId)
    .forEach(t=>{
      const ts=toDate(t.startDate);
      const te=toDate(t.endDate||t.startDate);
      if(!ts||!te)return;

      rows.push({
        type:'task',
        title:t.title||'Tugas',
        start:iso(ts),
        end:iso(te),
        status:t.status==='done'?'done':(t.overdue?'late':'active')
      });
    });

  if(!rows.length){
    return `<div class="gantt-empty">Belum ada Tahapan atau Tugas bertanggal yang dapat ditampilkan pada Gantt.</div>`;
  }

  const allDates=[];
  rows.forEach(r=>{
    allDates.push(toDate(r.start),toDate(r.end));
  });

  const projectStart=toDate(project.startDate);
  const projectEnd=toDate(project.targetDate);

  if(projectStart)allDates.push(projectStart);
  if(projectEnd)allDates.push(projectEnd);

  const validDates=allDates.filter(Boolean);
  let minDate=new Date(Math.min(...validDates.map(d=>d.getTime())));
  let maxDate=new Date(Math.max(...validDates.map(d=>d.getTime())));

  if(maxDate<minDate){
    maxDate=new Date(minDate);
  }

  const dayIndex=d=>Math.round((d-minDate)/MS_DAY);
  const durationDays=(s,e)=>Math.round((toDate(e)-toDate(s))/MS_DAY)+1;
  const totalDays=dayIndex(maxDate)+1;
  const timelineWidth=Math.max(totalDays*DAY_WIDTH,560);

  const fmtShort=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  const fmtRange=(s,e)=>{
    const a=toDate(s),b=toDate(e);
    return s===e?fmtShort(a):`${fmtShort(a)} – ${fmtShort(b)}`;
  };
  const statusLabel=status=>{
    if(status==='done')return'Selesai';
    if(status==='late')return'Perlu Update';
    return'Berjalan';
  };

  const getMonths=()=>{
    const result=[];
    let cursor=new Date(minDate.getFullYear(),minDate.getMonth(),1);

    while(cursor<=maxDate){
      const next=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
      const visibleStart=new Date(Math.max(cursor,minDate));
      const visibleEnd=new Date(Math.min(new Date(next-MS_DAY),maxDate));

      const left=dayIndex(visibleStart)*DAY_WIDTH;
      const width=(Math.round((visibleEnd-visibleStart)/MS_DAY)+1)*DAY_WIDTH;

      result.push({
        left,
        width,
        label:visibleStart.toLocaleDateString('id-ID',{month:'short',year:'numeric'})
      });

      cursor=next;
    }

    return result;
  };

  const getWeeks=()=>{
    const result=[];
    let cursor=new Date(minDate);
    let index=1;

    while(cursor<=maxDate){
      const end=new Date(Math.min(cursor.getTime()+6*MS_DAY,maxDate.getTime()));
      const left=dayIndex(cursor)*DAY_WIDTH;
      const width=(Math.round((end-cursor)/MS_DAY)+1)*DAY_WIDTH;

      result.push({left,width,label:`M${index}`});

      cursor=new Date(cursor.getTime()+7*MS_DAY);
      index++;
    }

    return result;
  };

  const selectedRows=mode==='stage'
    ? rows.filter(r=>r.type==='stage')
    : rows;

  const months=getMonths();
  const weeks=getWeeks();

  let table=`<div class="gantt-header-row">
    <div class="gantt-left-head">Timeline Project</div>
    <div class="gantt-timeline-header" style="width:${timelineWidth}px">
      ${months.map(m=>`<div class="gantt-month" style="left:${m.left}px;width:${m.width}px">${esc(m.label)}</div>`).join('')}
      ${weeks.map(w=>`<div class="gantt-week" style="left:${w.left}px;width:${w.width}px">${esc(w.label)}</div>`).join('')}
    </div>
  </div>`;

  selectedRows.forEach(r=>{
    const start=toDate(r.start);
    const left=dayIndex(start)*DAY_WIDTH;
    const width=durationDays(r.start,r.end)*DAY_WIDTH;
    const rowClass=r.type==='stage'?'gantt-row-stage':'';
    const titleClass=r.type==='stage'?'gantt-stage-title':'gantt-task-title';
    const barClass=r.type==='stage'?'stage':r.status;
    const range=fmtRange(r.start,r.end);
    const meta=r.type==='stage'
      ?range
      :`${statusLabel(r.status)} · ${range}`;

    table+=`<div class="gantt-data-row ${rowClass}">
      <div class="gantt-left-cell">
        <div class="${titleClass}">${esc(r.title)}</div>
        <div class="gantt-meta">${esc(meta)}</div>
      </div>
      <div class="gantt-timeline-cell" style="width:${timelineWidth}px">
        <div class="gantt-bar ${barClass}" style="left:${left}px;width:${width}px"></div>
      </div>
    </div>`;
  });

  return `<div style="padding:12px 14px">
    <div class="gantt-toolbar">
      <div class="gantt-segmented">
        <button class="${mode==='all'?'active':''}" onclick="rerenderProjectGantt('all')">Tahapan + Tugas</button>
        <button class="${mode==='stage'?'active':''}" onclick="rerenderProjectGantt('stage')">Tahapan Saja</button>
      </div>

      <div class="gantt-legend">
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-stage-color"></span>Tahapan</span>
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-active-color"></span>Tugas aktif</span>
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-done-color"></span>Selesai</span>
        <span class="gantt-legend-item"><span class="gantt-legend-box gantt-late-color"></span>Perlu Update</span>
      </div>
    </div>

    <div class="gantt-scroll">
      <div class="gantt-root">${table}</div>
    </div>

    <div class="gantt-info">
      Skala proporsional berdasarkan hari. Header menggunakan minggu; tanggal aktual ditampilkan pada label kiri.
    </div>
  </div>`;
}

async function loadProjectDocumentsOnOpen(details,projectId){
  if(!details.open)return;
  const cache=projectLazyCache(projectId).documents;
  const body=qs('#projectDocumentsBody');
  const summary=qs('#projectDocumentsSummary');

  if(cache.loaded){
    if(body)body.innerHTML=renderProjectDocumentsList(cache.rows);
    if(summary)summary.textContent=`· ${cache.total} dokumen`;
    return;
  }

  if(cache.loading)return;
  cache.loading=true;
  if(body)body.innerHTML='<div class="project-secondary-loading">Memuat dokumen…</div>';

  try{
    const result=await api('projectDocuments',{projectId});
    cache.rows=result.rows||[];
    cache.total=result.total||0;
    cache.loaded=true;
    cache.loading=false;

    if(state.page!=='project'||String(state.projectId)!==String(projectId))return;
    if(body)body.innerHTML=renderProjectDocumentsList(cache.rows);
    if(summary)summary.textContent=`· ${cache.total} dokumen`;

    cache.loading=false;
    if(body)body.innerHTML=`<div class="empty">Dokumen belum dapat dimuat. <button class="mini" onclick="loadProjectDocumentsOnOpen(qs('#projectDocumentsSection'),'${esc(projectId)}')">Coba lagi</button></div>`;

}

function renderProjectStages(project,stages,tasks,activeStageId){
  const rows=stages.map((stage,index)=>{
    const stageTasks=tasks.filter(t=>String(t.stageId||'')===String(stage.id));
    const done=stageTasks.filter(t=>t.status==='done').length;
    const active=stageTasks.length-done;
    const expanded=String(stage.id)===String(activeStageId);

    return `<section class="project-stage">
      <div class="project-stage-head">
        <div class="project-stage-no">${String(index+1).padStart(2,'0')}</div>
        <div style="cursor:pointer" onclick="toggleProjectStage('${esc(stage.id)}')">
          <div class="project-stage-name">${esc(stage.name)}</div>
          <div class="project-stage-meta">
            ${stage.startDate?esc(fmtDate(stage.startDate)):'Tanpa tanggal mulai'}
            ${stage.targetDate?' → '+esc(fmtDate(stage.targetDate)):''}
            ${stage.description?' · '+esc(stage.description):''}
          </div>
        </div>
        <div class="project-stage-counts">
          <span class="pill">${stageTasks.length} Tugas</span>
          <span class="pill">${done} Selesai</span>
          ${active?`<span class="pill">${active} Aktif</span>`:''}
          <button class="mini" onclick="openProjectStageForm('${esc(project.id)}','${esc(stage.id)}')">Edit</button>
        </div>
      </div>

      <div class="project-stage-body" id="project-stage-body-${esc(stage.id)}" style="${expanded?'':'display:none'}">
        ${stageTasks.length?stageTasks.map(renderProjectTaskRow).join(''):'<div class="empty">Belum ada Tugas pada Tahapan ini.</div>'}
        <div style="margin-top:8px">
          <button class="mini" onclick="openTaskForm('', '${esc(project.id)}', '${esc(stage.id)}')">+ Tugas pada Tahapan ini</button>
        </div>
      </div>
    </section>`;
  });

  const noStageTasks=tasks.filter(t=>!t.stageId);
  if(noStageTasks.length){
    rows.push(`<section class="project-stage">
      <div class="project-stage-head">
        <div class="project-stage-no">—</div>
        <div style="cursor:pointer" onclick="toggleProjectStage('none')">
          <div class="project-stage-name">Tanpa Tahapan</div>
          <div class="project-stage-meta">Tugas Project yang belum dikelompokkan ke Tahapan.</div>
        </div>
        <div class="project-stage-counts">
          <span class="pill">${noStageTasks.length} Tugas</span>
        </div>
      </div>
      <div class="project-stage-body" id="project-stage-body-none">
        ${noStageTasks.map(renderProjectTaskRow).join('')}
      </div>
    </section>`);
  }

  if(!rows.length){
    return `<div class="empty">
      Belum ada Tahapan. Tambahkan Tahapan untuk mengelompokkan Tugas pada Project ini.
    </div>`;
  }

  return rows.join('');
}

function projectActivityWhenLabel(x){
  const date=String(x.activityDate||'').trim();
  const time=String(x.activityTime||'').trim();
  if(date)return `${fmtDate(date)}${time?' · '+time:''}`;
  return dateTimeLabel(x.createdAt);
}
function projectActivityRecordedLabel(x){
  if(String(x.origin||'')!=='Manual'||!x.createdAt)return'';
  const eventDate=String(x.activityDate||'').trim();
  const createdDate=String(x.createdAt||'').slice(0,10);
  if(eventDate && eventDate!==createdDate){
    return `Dicatat di sistem ${dateTimeLabel(x.createdAt)}`;
  }
  return '';
}
function renderProjectActivityLink(link){
  const value=String(link||'').trim();
  if(!value)return'';
  if(/^https?:\/\//i.test(value)){
    const isDrive=/drive\.google\.com|docs\.google\.com/i.test(value);
    return `<a class="mini timeline-link" target="_blank" rel="noopener" href="${esc(value)}">${isDrive?'Buka Dokumen ↗':'Buka Link ↗'}</a>`;
  }
  return `<span class="pill blue">${esc(value)}</span>`;
}
function renderProjectTimeline(){

    (!state.projectTimeline.type||x.type===state.projectTimeline.type)&&
    (!state.projectTimeline.q||(x.title+' '+x.details+' '+x.actor+' '+(x.linksList||[]).join(' ')).toLowerCase().includes(state.projectTimeline.q))
  );
  const shown=a.slice(0,state.projectTimeline.limit);
  qs('#timelineRows').innerHTML=shown.length?shown.map(x=>{
    const recorded=projectActivityRecordedLabel(x);

    return `<div class="timeline-item">

function taskSectionGroups(tasks){
  const update=tasks.filter(t=>t.status!=='done'&&t.overdue);

  const done=tasks.filter(t=>t.status==='done');

  return {todo,progress,done,update};
}

function renderTaskSectionPagination(key,total,totalPages,current){
  if(total<=TASK_PAGE_SIZE)return '';

  let first=Math.max(1,current-2);
  let last=Math.min(totalPages,first+4);
  first=Math.max(1,last-4);

  const pages=[];
  for(let p=first;p<=last;p++)pages.push(p);

  const from=(current-1)*TASK_PAGE_SIZE+1;
  const to=Math.min(total,current*TASK_PAGE_SIZE);

  return `<div class="task-section-pagination">
    <div class="pagination-info">Menampilkan ${from}–${to} dari ${total} tugas · 10 tugas per halaman</div>
    <div class="pagination-controls">
      <button class="page-btn" ${current<=1?'disabled':''} onclick="goTaskSectionPage('${key}',${current-1})">‹</button>
      ${pages.map(p=>`<button class="page-btn ${p===current?'active':''}" onclick="goTaskSectionPage('${key}',${p})">${p}</button>`).join('')}
      <button class="page-btn" ${current>=totalPages?'disabled':''} onclick="goTaskSectionPage('${key}',${current+1})">›</button>
    </div>
  </div>`;
}

function addDaysToDateKey(key,days){
  const [y,m,d]=String(key||'').split('-').map(Number);
  if(!y||!m||!d)return '';
  const dt=new Date(Date.UTC(y,m-1,d));
  dt.setUTCDate(dt.getUTCDate()+days);
  return dt.toISOString().slice(0,10);
}
function compactCalendarDate(key){return String(key||'').replaceAll('-','')}
function compactCalendarDateTime(key,time){
  if(!key)return '';
  return compactCalendarDate(key)+'T'+String(time||'00:00').replace(':','')+'00';
}

function taskCalendarUrl(t){
  if(!t?.startDate)return '';

  const params=new URLSearchParams();
  params.set('action','TEMPLATE');
  params.set('text',t.title||'Tugas');

  const endDate=t.endDate||t.startDate;

  if(t.startTime){
    const start=compactCalendarDateTime(t.startDate,t.startTime);
    let end='';

    if(t.endTime){
      end=compactCalendarDateTime(endDate,t.endTime);
    }else{
      const dt=new Date(`${t.startDate}T${t.startTime}:00`);
      dt.setHours(dt.getHours()+1);
      const y=dt.getFullYear();
      const m=String(dt.getMonth()+1).padStart(2,'0');
      const d=String(dt.getDate()).padStart(2,'0');
      const hh=String(dt.getHours()).padStart(2,'0');
      const mm=String(dt.getMinutes()).padStart(2,'0');
      end=`${y}${m}${d}T${hh}${mm}00`;
    }

    params.set('dates',start+'/'+end);
    params.set('ctz','Asia/Jakarta');
  }else{
    params.set(
      'dates',
      compactCalendarDate(t.startDate)+'/'+compactCalendarDate(addDaysToDateKey(endDate,1))
    );
  }

  const details=[
    t.description||'',
    t.projectName?`Project: ${t.projectName}`:'',
    t.stageName?`Tahapan: ${t.stageName}`:'',
    (t.picList||[]).length?`PIC: ${t.picList.join(', ')}`:''
  ].filter(Boolean).join('\n');

  if(details)params.set('details',details);

  const emails=String(t.picEmail||'')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean);

  if(emails.length)params.set('add',emails.join(','));

  return 'https://calendar.google.com/calendar/render?'+params.toString();
}

          ? `<div class="task-context">
              <button onclick="openProjectContext('${esc(t.projectId)}','${esc(t.stageId||'')}','${esc(t.id)}')">${esc(t.projectName||'Project')}</button>
              ${t.stageId?`<span>›</span><button onclick="openProjectContext('${esc(t.projectId)}','${esc(t.stageId)}','${esc(t.id)}')">${esc(t.stageName||'Tahapan')}</button>`:''}
            </div>`
          : '';

        return `<div class="my-task-row">
          <div class="my-task-when">${esc(t.timeLabel||'Tanpa tanggal')}</div>
          <div>
            <div class="my-task-title">${esc(t.title)}</div>
            <div class="my-task-meta">${esc(t.program)} · ${esc(t.substansi)} · ${esc(t.priority)}</div>
            ${context}
          </div>
          <button class="mini" onclick="showTaskDetail('${esc(t.id)}')">Detail</button>
          <select class="my-task-status ${esc(t.status)}" onchange="changeRecapStatus('${esc(t.id)}',this)">
            <option value="todo" ${t.status==='todo'?'selected':''}>Perlu Dikerjakan</option>
            <option value="progress" ${t.status==='progress'?'selected':''}>Sedang Dikerjakan</option>
            <option value="done" ${t.status==='done'?'selected':''}>Selesai</option>
          </select>
        </div>`;
      }).join(''):'<div class="empty">Tidak ada tugas.</div>'}
    </div>`;
}

async function changeRecapStatus(id,select){
  const task=(window.__recapTasks||[]).find(t=>t.id===id);
  if(!task)return;

  const next=select.value;

  if(next==='done'&&task.status!=='done'){
    select.value=task.status;
    completeTask(id,true);
    return;
  }

  try{
    await api('updateTaskStatus',{id,status:next});
    showToast('Status diperbarui.');
    await loadPage();
  }catch(e){
    select.value=task.status;
    showToast(e.message,true);
  }
}

let __taskSaveInFlight=false;

async function saveTaskForm(id){
  if(__taskSaveInFlight)return;

  const button=qs('#taskSaveButton');
  const originalText=button?.textContent||'Simpan Tugas';

  __taskSaveInFlight=true;
  if(button){
    button.disabled=true;
    button.textContent='Menyimpan…';
  }

  try{
    const projectId=qs('#fProject').value||'';
    const stageId=projectId?(qs('#fStage')?.value||''):'';

    const payload={
      id,
      requestId:id?'':(window.__taskRequestId||''),
      title:qs('#fTitle').value,
      program:qs('#fProgram').value,
      projectId,
      stageId,
      substansi:qs('#fActivity').value,
      tag:qs('#fTag').value,
      pic:qsa('input[name="fPic"]:checked').map(x=>x.value),
      picEmail:qs('#fPicEmail')?.value||'',
      taskAssigner:qs('#fAssigner').value,
      taskAssignerOption:qs('#fAssigner').value,
      timeType:qs('#fTimeType').value,
      startDate:qs('#fStartDate').value,
      endDate:qs('#fEndDate').value,
      startTime:qs('#fStartTime').value,
      endTime:qs('#fEndTime').value,
      dayMode:qs('#fDayMode').value,
      priority:qs('#fPriority').value,
      status:window.__taskFormStatus||'todo',
      description:qs('#fDesc').value,
      resultText:''
    };

    const saved=await api('saveTask',payload);

    closeModal();
    showToast(saved?.idempotent
      ? 'Tugas sudah tersimpan. Duplikasi dicegah.'
      : 'Tugas berhasil disimpan.');

    if(state.page==='project'){
      state.projectStageFocus=stageId;
    }

    await loadPage();
  }catch(e){
    showToast(e.message,true);
  }finally{
    __taskSaveInFlight=false;
    if(button&&button.isConnected){
      button.disabled=false;
      button.textContent=originalText;
    }
  }
}

}

async function submitTaskUpdate(id){
  const task=findTaskInCurrentState(id);
  const previous=task?.status||'';

  if(__taskUpdateStatus==='done'&&previous!=='done'){
    closeModal();
    completeTask(id,state.page==='taskrecap');
    return;
  }

  try{
    await api('updateTaskStatus',{id,status:__taskUpdateStatus});
    closeModal();
    showToast('Status diperbarui.');
    await loadPage();
  }catch(e){
    showToast(e.message,true);
  }
}

let __completeAttachMode='file';

function completeTask(id,recap=false){
  const task=findTaskInCurrentState(id);

  __completeAttachMode='file';

  openModal(
    'Selesaikan Tugas',
    `<div class="complete-task-name">${esc(task?.title||'')}</div>
     <div class="field">
       <label>Hasil Penyelesaian *</label>
       <textarea id="completeResult" style="min-height:92px" placeholder="Tuliskan hasil/output pekerjaan yang telah diselesaikan..."></textarea>
       <div class="complete-required">Hasil pekerjaan wajib dicatat sebelum status menjadi Selesai.</div>
     </div>

     ${task?.projectId?`<div class="helper" style="margin-top:10px">
       Tugas ini terhubung ke Project. File/Docs hasil akan otomatis masuk ke <strong>Dokumen Terhubung</strong>; link hasil juga masuk ke <strong>Sumber & Link Tambahan</strong> dan Inventaris Dokumen.
     </div>`:''}

     <div style="margin-top:16px">
       <div class="sub" style="font-weight:700;color:var(--ink)">Lampiran Hasil <span style="font-weight:400">(opsional)</span></div>
       <div class="complete-attachments">
         <div class="complete-tabs">
           <button class="complete-tab active" data-complete-tab="file" onclick="renderCompleteAttachmentMode('file')">▣ File</button>
           <button class="complete-tab" data-complete-tab="link" onclick="renderCompleteAttachmentMode('link')">↗ Link</button>
           <button class="complete-tab" data-complete-tab="docs" onclick="renderCompleteAttachmentMode('docs')">▧ Buat Docs</button>
         </div>
         <div id="completeAttachmentArea"></div>
       </div>
     </div>`,
    `<button class="btn" onclick="closeModal()">Batal</button>
     <button class="btn primary" onclick="submitComplete('${esc(id)}',${recap})">Simpan & Selesaikan</button>`
  );

  renderCompleteAttachmentMode('file');
}

function renderCompleteAttachmentMode(mode){
  __completeAttachMode=mode;

  qsa('[data-complete-tab]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.completeTab===mode);
  });

  const host=qs('#completeAttachmentArea');
  if(!host)return;

  if(mode==='file'){
    host.innerHTML=`<input id="completeFiles" type="file" multiple>
      <div class="helper" style="margin-top:6px">Maksimal 5 file per penyelesaian, 8 MB per file.</div>`;
  }else if(mode==='link'){
    host.innerHTML=`<div class="field">
      <label>Judul Link</label>
      <input id="completeLinkTitle" placeholder="Contoh: Hasil Verifikasi">
    </div>
    <div class="field" style="margin-top:8px">
      <label>URL</label>
      <input id="completeLinkUrl" placeholder="https://...">
    </div>`;
  }else{
    host.innerHTML=`<div class="sub">
      Google Docs hasil akan dibuat otomatis dan ditautkan sebagai Lampiran Hasil.
    </div>`;
  }
}

async function submitComplete(id,recap){
  const taskBeforeComplete=findTaskInCurrentState(id);
  const completedProjectId=taskBeforeComplete?.projectId||'';
  const resultText=qs('#completeResult')?.value.trim()||'';

  if(!resultText){
    showToast('Hasil Penyelesaian wajib diisi.',true);
    return;
  }

  try{
    // Save optional result attachment first.
    if(__completeAttachMode==='file'){
      const files=[...(qs('#completeFiles')?.files||[])];

      if(files.length>5){
        throw new Error('Maksimal 5 file per penyelesaian.');
      }

      for(const file of files){
        if(file.size>8*1024*1024){
          throw new Error(`File ${file.name} melebihi batas 8 MB.`);
        }

        await api('uploadAttachment',{
          taskId:id,
          attachmentType:'result',
          fileName:file.name,
          mimeType:file.type||'application/octet-stream',
          sizeBytes:file.size,
          base64:await fileToBase64(file)
        });
      }
    }

    if(__completeAttachMode==='link'){
      const url=qs('#completeLinkUrl')?.value.trim()||'';
      const title=qs('#completeLinkTitle')?.value.trim()||'Hasil Penyelesaian';

      if(url){
        await api('createLinkAttachment',{
          taskId:id,
          attachmentType:'result',
          title,
          url
        });
      }
    }

    if(__completeAttachMode==='docs'){
      await api('createResultDoc',{taskId:id,resultText});
    }

    await api('completeTask',{id,resultText});

    if(completedProjectId){
      invalidateProjectLazyCache(completedProjectId,['documents','sources','history']);
    }

    closeModal();
    showToast('Tugas diselesaikan.');
    await loadPage();

    if(
      state.page==='project' &&
      state.projectId
    ){
    }
  }catch(e){
    showToast(e.message,true);
  }
}

function attachmentList(items,managed=false){return items&&items.length?items.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;margin:4px 0"><span>${a.driveUrl?`<a target="_blank" rel="noopener" href="${esc(a.driveUrl)}">${esc(a.fileName)}</a>`:esc(a.fileName)}</span>${managed?`<button class="mini danger" onclick="deleteAttachment('${esc(a.id)}')">Hapus</button>`:''}</div>`).join(''):'—'}

function openAttachmentForm(taskId,type){openModal('Tambah Lampiran',`<div class="form-grid"><div class="field full"><label>Jenis Lampiran</label><select id="attMode"><option value="link">Link</option><option value="file">Upload File</option></select></div><div class="field full"><label>Judul / Nama File</label><input id="attName"></div><div class="field full"><label>URL (untuk Link)</label><input id="attUrl" placeholder="https://..."></div><div class="field full"><label>File (maks. 8 MB)</label><input id="attFile" type="file"></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveAttachment('${esc(taskId)}','${esc(type)}')">Simpan</button>`)}
async function saveAttachment(taskId,type){try{const task=findTaskInCurrentState(taskId);const mode=qs('#attMode').value;if(mode==='link'){await api('createLinkAttachment',{taskId,attachmentType:type,title:qs('#attName').value,url:qs('#attUrl').value})}else{const f=qs('#attFile').files[0];if(!f)throw new Error('Pilih file.');const data=await fileToBase64(f);await api('uploadAttachment',{taskId,attachmentType:type,fileName:qs('#attName').value||f.name,mimeType:f.type||'application/octet-stream',sizeBytes:f.size,base64:data})}if(type==='result'&&task?.projectId)invalidateProjectLazyCache(task.projectId,['documents','sources','history']);closeModal();showToast('Lampiran ditambahkan.');await showTaskDetail(taskId)}catch(e){showToast(e.message,true)}}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop());r.onerror=()=>reject(new Error('Gagal membaca file.'));r.readAsDataURL(file)})}
async function createResultDoc(taskId){try{const task=findTaskInCurrentState(taskId);await api('createResultDoc',{taskId});if(task?.projectId)invalidateProjectLazyCache(task.projectId,['documents','history']);showToast('Google Docs hasil dibuat.');await showTaskDetail(taskId)}catch(e){showToast(e.message,true)}}

      page:state.page,
      week:state.week,
      projectId:state.projectId

    state.bootstrap=initial.bootstrap;

  }
}
init();
