<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Workspace Asdep PPP</title>
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--line:#e4e4e7;--text:#18181b;--muted:#71717a;
  --soft:#fafafa;--dark:#18181b;--green:#166534;--green-bg:#f0fdf4;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--amber:#92400e;--amber-bg:#fffbeb;
  --red:#b91c1c;--red-bg:#fef2f2;--purple:#6d28d9;--purple-bg:#f5f3ff
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.brand{padding:10px 10px 18px;font-weight:800;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px}
.nav{display:grid;gap:3px}
.nav button{border:0;background:transparent;border-radius:7px;padding:9px 10px;text-align:left;font-size:13px;color:#3f3f46}
.nav button:hover{background:#f4f4f5}
.nav button.active{background:#18181b;color:#fff}
.main{min-width:0;padding:20px 22px 40px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:24px;margin:0;line-height:1.2}
.subtitle{color:var(--muted);font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#18181b;padding:8px 11px;font-size:12px;font-weight:650}
.btn:hover{background:#f4f4f5}.btn.primary{background:#18181b;border-color:#18181b;color:#fff}.btn.danger{color:#b91c1c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:9px;background:#fff;padding:13px 14px;min-width:0}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat-value{font-size:24px;font-weight:800;margin-top:4px}.stat-note{font-size:10px;color:var(--muted);margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-title{font-size:14px;font-weight:750}.card-note{font-size:11px;color:var(--muted);margin-top:2px}
.card-body{padding:14px}.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:#fafafa;color:#71717a;font-size:11px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
td{font-size:12px;padding:10px;border-bottom:1px solid #f1f1f2;vertical-align:top}
tr:last-child td{border-bottom:0}
.sub{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:10px;background:#fff;color:#52525b;white-space:nowrap}
.pill.todo{background:#fafafa}.pill.progress{background:var(--blue-bg);border-color:#dbeafe;color:var(--blue)}
.pill.done{background:var(--green-bg);border-color:#dcfce7;color:var(--green)}
.pill.high{background:var(--red-bg);border-color:#fecaca;color:var(--red)}
.pill.medium{background:var(--amber-bg);border-color:#fde68a;color:var(--amber)}
.pill.low{background:#f4f4f5}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(2,190px) auto;gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 10px;font-size:13px}
.field textarea{min-height:88px;resize:vertical}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:#52525b}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{padding:28px;text-align:center;color:#a1a1aa;font-size:12px}
.row-actions{display:flex;flex-wrap:wrap;gap:5px}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 7px;font-size:10px;font-weight:650}
.mini.primary{background:#18181b;color:#fff;border-color:#18181b}.mini.danger{color:#b91c1c}
.loading{padding:50px;text-align:center;color:var(--muted)}
.error{padding:12px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:8px;margin-bottom:14px;font-size:12px}
.matrix{min-width:1000px}.matrix td.center,.matrix th.center{text-align:center}
.load{display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-weight:700}
.load.l0{background:#fafafa}.load.l1{background:#f0fdf4;color:#166534}.load.l2{background:#eff6ff;color:#1d4ed8}
.load.l3{background:#fffbeb;color:#92400e}.load.l4,.load.l5{background:#fef2f2;color:#b91c1c}
.load.leave-day{background:#f5f3ff;color:#6d28d9}.load.leave-conflict{background:#fef2f2;color:#b91c1c}
.task-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.task-column{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.task-column-head{padding:10px 12px;background:#fafafa;border-bottom:1px solid var(--line);font-size:12px;font-weight:750}
.task-card{padding:11px 12px;border-bottom:1px solid #f1f1f2}.task-card:last-child{border-bottom:0}
.task-title{font-size:12px;font-weight:750;line-height:1.4}.task-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.app-groups{display:grid;gap:14px}.app-group{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.app-group-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fafafa;border-bottom:1px solid var(--line)}
.app-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}
.app-card{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:185px;display:flex;flex-direction:column}
.app-icon{width:38px;height:38px;border-radius:8px;background:#18181b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
.app-name{font-size:13px;font-weight:750;margin-top:9px}.app-desc{font-size:11px;color:#52525b;line-height:1.5;margin-top:4px;flex:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(24,24,27,.34);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-backdrop.show{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.16)}
.modal-head,.modal-foot{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head{border-bottom:1px solid var(--line)}.modal-foot{border-top:1px solid var(--line)}
.modal-body{padding:15px}.modal-title{font-weight:800;font-size:15px}
.toast{position:fixed;right:18px;bottom:18px;background:#18181b;color:#fff;border-radius:8px;padding:10px 12px;font-size:12px;z-index:200;display:none;max-width:360px}
.toast.show{display:block}.toast.error-toast{background:#991b1b}
.mobile-nav{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.app-grid{grid-template-columns:repeat(2,1fr)}.task-columns{grid-template-columns:1fr}}
@media(max-width:760px){
  .app{display:block}.sidebar{display:none}.main{padding:14px 12px 75px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:80;overflow:auto}
  .mobile-nav button{border:0;background:#fff;padding:10px 12px;font-size:10px;white-space:nowrap}.mobile-nav button.active{font-weight:800;background:#f4f4f5}
  .stats,.grid2,.grid3,.form-grid,.toolbar,.app-grid{grid-template-columns:1fr}.topbar{flex-direction:column}.toolbar input,.toolbar select,.field input,.field select,.field textarea{font-size:16px}
}

.nav-group{margin-top:14px}.nav-group:first-child{margin-top:0}.nav-group-label{padding:0 10px;margin-bottom:5px;font-size:9px;font-weight:700;color:#a1a1aa;text-transform:uppercase;letter-spacing:.05em}.nav-divider{height:1px;background:#f1f1f2;margin:12px 5px 2px}
.nav-group button{display:block;width:100%}
.brand-wrap{display:flex;gap:10px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.brand-mark{width:32px;height:32px;border-radius:8px;background:#18181b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}.brand-copy{font-weight:800;font-size:14px}.brand-copy small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px;line-height:1.45}
.project-link{display:inline-flex;border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:650}.project-list-head,.project-row{display:grid;grid-template-columns:minmax(240px,1.4fr) 150px 110px 150px 80px 90px;gap:10px;align-items:center}.project-list-head{padding:9px 13px;background:#fafafa;border-bottom:1px solid var(--line);font-size:10px;color:#71717a;font-weight:700}.project-row{padding:12px 13px;border-bottom:1px solid #f1f1f2}.project-row:last-child{border-bottom:0}.project-name{font-size:12px;font-weight:750}.project-desc{font-size:10px;color:var(--muted);line-height:1.45;margin-top:3px}.project-back{font-size:10px;color:#52525b;margin-bottom:7px;cursor:pointer}.project-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.project-health{display:flex;gap:8px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:14px;font-size:10px;color:#52525b}.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.linked-item,.source-item,.timeline-item{padding:10px 12px;border-bottom:1px solid #f1f1f2}.linked-item:last-child,.source-item:last-child,.timeline-item:last-child{border-bottom:0}.linked-title{font-size:11px;font-weight:700}.timeline-top{display:flex;justify-content:space-between;gap:10px}.timeline-date{font-size:9px;color:var(--muted)}.timeline-text{font-size:10px;color:#52525b;line-height:1.5;margin-top:4px}.timeline-meta{font-size:9px;color:#a1a1aa;margin-top:4px}.timeline-tools{display:grid;grid-template-columns:minmax(180px,1fr) 150px;gap:7px}.timeline-tools input,.timeline-tools select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-size:10px;background:#fff}.agenda-active td{background:#f0fdf4}.agenda-active td:first-child{box-shadow:inset 3px 0 0 #166534}.agenda-next td{background:#fffbeb}.agenda-next td:first-child{box-shadow:inset 3px 0 0 #92400e}
.load.clickable{cursor:pointer;background:#fff}.load.clickable:hover{box-shadow:0 0 0 2px #e4e4e7}.load.clickable.l1{background:#f0fdf4}.load.clickable.l2{background:#eff6ff}.load.clickable.l3{background:#fffbeb}.load.clickable.l4,.load.clickable.l5{background:#fef2f2}
.helper{font-size:10px;color:var(--muted);line-height:1.45;margin-top:4px}
@media(max-width:1100px){.project-list-head,.project-row{grid-template-columns:minmax(220px,1.4fr) 135px 100px 135px 70px}.project-list-head>*:nth-child(6),.project-row>*:nth-child(6){display:none}.project-grid{grid-template-columns:1fr}}


/* Minimal global loading progress */
.global-progress{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:3px;
  z-index:500;
  pointer-events:none;
  opacity:0;
  background:transparent;
  transition:opacity .15s ease;
}
.global-progress.show{opacity:1}
.global-progress-bar{
  width:0;
  height:100%;
  background:#18181b;
  border-radius:0 999px 999px 0;
  box-shadow:0 1px 5px rgba(24,24,27,.14);
  transition:width .28s ease;
}
@media(prefers-reduced-motion:reduce){
  .global-progress,
  .global-progress-bar{transition:none}
}


/* Agenda day switcher */
.agenda-switch{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fafafa;
}
.agenda-switch button{
  border:0;
  background:transparent;
  border-radius:6px;
  padding:6px 10px;
  font-size:10.5px;
  font-weight:650;
  color:#71717a;
}
.agenda-switch button:hover{
  background:#f4f4f5;
  color:#18181b;
}
.agenda-switch button.active{
  background:#fff;
  color:#18181b;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.agenda-all-day{
  font-weight:650;
  color:#4338ca;
}


/* Previous Tren Pekerjaan visual restored */
.trend-segmented{
  display:flex;gap:3px;padding:3px;border:1px solid var(--line);
  border-radius:8px;background:#fff;flex-wrap:wrap
}
.trend-segmented button{
  border:0;border-radius:6px;background:transparent;padding:7px 10px;
  font-size:10.5px;color:#52525b
}
.trend-segmented button.active{background:#18181b;color:#fff}
.trend-volume-card{margin-bottom:14px}
.trend-chart-card{min-height:320px}
.trend-legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.trend-legend-item{display:flex;align-items:center;gap:5px}
.trend-legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.trend-legend-dot.incoming{background:#18181b}
.trend-legend-dot.completed{background:#bfdbfe}
.trend-chart-scroll{overflow-x:auto}
.trend-volume-chart{
  min-height:235px;padding:14px 15px 10px;display:flex;align-items:flex-end;gap:10px
}
.trend-month-group{
  flex:1;min-width:44px;height:210px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end
}
.trend-bar-pair{
  width:100%;height:180px;display:flex;justify-content:center;align-items:flex-end;gap:4px
}
.trend-bar{width:36%;min-height:2px;border-radius:5px 5px 2px 2px}
.trend-bar.incoming{background:#18181b}
.trend-bar.completed{background:#bfdbfe}
.trend-month-label{font-size:10px;color:var(--muted);margin-top:7px;white-space:nowrap}
.trend-grid{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;margin-bottom:14px
}
.trend-monthly-composition{display:grid;gap:10px;padding:14px 15px 8px}
.trend-month-row{
  display:grid;grid-template-columns:48px minmax(0,1fr) 30px;
  gap:8px;align-items:center
}
.trend-month-row-label{font-size:10px;font-weight:650;color:#52525b}
.trend-month-row-total{font-size:10px;font-weight:700;color:#52525b;text-align:right}
.trend-stack{
  height:16px;display:flex;border-radius:999px;overflow:hidden;background:#f4f4f5
}
.trend-stack-segment{height:100%;min-width:0}
.trend-monthly-legend{
  display:flex;flex-wrap:wrap;gap:7px 11px;padding:5px 15px 14px;
  font-size:9.5px;line-height:1.35;color:var(--muted)
}
.trend-monthly-legend-item{display:inline-flex;align-items:center;gap:5px}
.trend-monthly-swatch{width:9px;height:9px;border-radius:2px;flex:none}
.trend-team-card{margin-bottom:14px}
.trend-team-metric{
  display:flex;gap:3px;padding:3px;border:1px solid var(--line);
  border-radius:8px;background:#fff;flex-wrap:wrap
}
.trend-team-metric button{
  border:0;border-radius:6px;background:transparent;padding:6px 9px;
  font-size:10.5px;color:#52525b
}
.trend-team-metric button.active{background:#18181b;color:#fff}
.trend-team-scroll{overflow-x:auto}
#trendTeamHeatmap{--trend-month-count:10}
.trend-team-grid{
  display:grid;
  grid-template-columns:150px repeat(var(--trend-month-count), minmax(48px,1fr)) 54px;
  align-items:stretch
}
.trend-team-header{background:#fafafa;border-bottom:1px solid var(--line)}
.trend-team-name-head,.trend-team-month-head,.trend-team-total-head{
  min-height:34px;padding:8px 7px;display:flex;align-items:center;justify-content:center;
  border-right:1px solid #f4f4f5;font-size:9.5px;font-weight:700;color:#71717a;
  text-transform:uppercase;letter-spacing:.02em
}
.trend-team-name-head{justify-content:flex-start}
.trend-team-row{border-bottom:1px solid #f4f4f5}
.trend-team-row:last-child{border-bottom:0}
.trend-team-name,.trend-team-total{
  min-height:38px;padding:7px 9px;display:flex;align-items:center;background:#fff;font-size:10.5px
}
.trend-team-name{font-weight:650;border-right:1px solid #f4f4f5}
.trend-team-total{justify-content:center;font-weight:750;border-left:1px solid #f4f4f5}
.trend-team-cell{
  min-height:28px;margin:5px;border:1px solid var(--line);border-radius:6px;
  display:flex;align-items:center;justify-content:center;background:#fff;color:#52525b;
  font-size:10px;font-weight:700
}
.trend-team-cell.heat-1{background:#eff6ff;border-color:#dbeafe;color:#1d4ed8}
.trend-team-cell.heat-2{background:#dbeafe;border-color:#bfdbfe;color:#1e40af}
.trend-team-cell.heat-3{background:#bfdbfe;border-color:#93c5fd;color:#1e3a8a}
.trend-team-cell.heat-4{background:#4f46e5;border-color:#4f46e5;color:#fff}
@media(max-width:980px){.trend-grid{grid-template-columns:1fr}}


/* v1.47 — workload cues, stacked distributions, quick collaboration link */
.workload-legend{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:5px;
  font-size:9.5px;
  color:var(--muted);
}
.workload-legend-item{display:inline-flex;align-items:center;gap:5px}
.workload-legend-sample{
  min-width:24px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:6px;font-size:9px;font-weight:800;background:#fff
}
.workload-legend-sample.leave{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}
.workload-legend-sample.pd{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.workload-legend-sample.tlk{background:#f0fdfa;border-color:#99f6e4;color:#0f766e}
.load.workload-status-cell{
  position:relative;min-width:42px;min-height:38px;padding:4px 5px 3px;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px
}
.workload-main-value{display:block;line-height:1}
.workload-mini-flags{min-height:9px;display:flex;gap:2px;align-items:center;justify-content:center}
.workload-mini-flag{
  display:inline-flex;align-items:center;justify-content:center;height:11px;padding:0 3px;
  border-radius:3px;font-size:6.8px;line-height:1;font-weight:800;letter-spacing:.01em
}
.workload-mini-flag.pd{background:#dbeafe;color:#1d4ed8}
.workload-mini-flag.tlk{background:#ccfbf1;color:#0f766e}
.load.workload-leave{background:#f5f3ff!important;border-color:#ddd6fe!important;color:#6d28d9!important}
.load.workload-pd{box-shadow:inset 0 -3px 0 #60a5fa}
.load.workload-tlk{box-shadow:inset 0 -3px 0 #2dd4bf}
.load.workload-pd.workload-tlk{box-shadow:inset -20px -3px 0 #60a5fa,inset 20px -3px 0 #2dd4bf}
.workload-conflict-dot{
  position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
  border:2px solid #fff;background:#dc2626
}
.workload-popup-status{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}

.workload-distribution-stack{display:grid;gap:14px;margin-bottom:14px}

.quick-collab{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px;margin-bottom:14px;background:#fff;border:1px solid var(--line);
  border-radius:10px
}
.quick-collab-title{font-size:12px;font-weight:750}
.quick-collab-note{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}
@media(max-width:700px){.quick-collab{align-items:flex-start;flex-direction:column}.quick-collab .btn{width:100%}}


/* v1.48 — workspace identity */
.participation-mark{
  overflow:hidden;
}
.participation-mark svg{
  width:24px;
  height:24px;
  display:block;
  fill:#fff;
  stroke:#fff;
  stroke-width:1.35;
  stroke-linecap:round;

<script>
/*
  Netlify frontend v1.53 — simplified PIC selector alignment.
  Netlify frontend.
  Recommended production setup:
  - index.html is hosted by Netlify/GitHub
  - POST /api is proxied by a Netlify Function to Apps Script
  - Code.gs above is deployed as Apps Script Web App backend

  If you already have your own proxy endpoint, change API_ENDPOINT below.
*/
const API_ENDPOINT = '/api';


let __activeRequests=0;
let __progressTimer=null;

function startGlobalProgress(){
  __activeRequests++;
  if(__activeRequests!==1) return;

  const shell=document.getElementById('globalProgress');
  const bar=document.getElementById('globalProgressBar');
  if(!shell||!bar) return;

  clearTimeout(__progressTimer);
  shell.classList.add('show');
  bar.style.width='10%';

  requestAnimationFrame(()=>{
    bar.style.width='62%';
  });

  __progressTimer=setTimeout(()=>{
    if(__activeRequests>0) bar.style.width='82%';
  },650);
}

function finishGlobalProgress(){
  __activeRequests=Math.max(0,__activeRequests-1);
  if(__activeRequests>0) return;

  const shell=document.getElementById('globalProgress');
  const bar=document.getElementById('globalProgressBar');
  if(!shell||!bar) return;

  clearTimeout(__progressTimer);
  bar.style.width='100%';

  setTimeout(()=>{
    shell.classList.remove('show');
    bar.style.width='0';
  },180);
}

const __nativeFetch=window.fetch.bind(window);
window.fetch=async function(){
  startGlobalProgress();
  try{
    return await __nativeFetch(...arguments);
  }finally{
    finishGlobalProgress();
  }
};


const PAGES=[
  ['workload','Ringkasan Pekerjaan','Monitoring'],
  ['trend','Tren Pekerjaan','Monitoring'],
  ['project','Project','Pekerjaan'],
  ['taskmatrix','Kelola Tugas','Pekerjaan'],
  ['taskrecap','Tugas Saya','Pekerjaan'],
  ['documents','Dokumen','Referensi & Koordinasi'],
  ['pics','PIC & Kontak Instansi','Referensi & Koordinasi'],
  ['blast','Blast & Komunikasi','Referensi & Koordinasi'],
  ['apps','Aplikasi Tim','Tools']
];

const state={
  page:new URLSearchParams(location.search).get('page')||'workload',
  model:null,
  bootstrap:null,
  week:'',
  trendFilters:{period:'year',program:'',activity:''},
  projectId:new URLSearchParams(location.search).get('project')||'',
  projectTimeline:{q:'',type:'',limit:20}
};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function j(v){try{return JSON.parse(v||'[]')}catch(_){return[]}}
function qs(sel,root=document){return root.querySelector(sel)}
function qsa(sel,root=document){return [...root.querySelectorAll(sel)]}
function statusLabel(s){return s==='done'?'Selesai':s==='progress'?'Sedang Dikerjakan':'Perlu Dikerjakan'}
function priorityClass(p){return p==='Tinggi'?'high':p==='Rendah'?'low':'medium'}
function fmtDate(v){if(!v)return'—';const d=new Date(v.length===10?v+'T00:00:00':v);return isNaN(d)?v:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function showToast(msg,error=false){const t=qs('#toast');t.textContent=msg;t.className='toast show'+(error?' error-toast':'');setTimeout(()=>t.className='toast',2800)}
function setError(msg=''){qs('#errorBox').innerHTML=msg?`<div class="error">${esc(msg)}</div>`:''}

async function api(action,payload={}){
  const READ_ACTIONS=new Set([
    'bootstrap',
    'getPage',
    'taskDetail'
  ]);

  if(READ_ACTIONS.has(action)){
    const params=new URLSearchParams();
    params.set('action',action);

    Object.entries(payload||{}).forEach(([key,value])=>{
      if(value===undefined||value===null||value==='') return;
      params.set(key,String(value));
    });

    const res=await fetch(
      API_ENDPOINT+'?'+params.toString(),
      {
        method:'GET',
        headers:{
          'Accept':'application/json'
        }
      }
    );

    const text=await res.text();
    let out;

    try{
      out=JSON.parse(text);
    }catch(_){
      throw new Error(
        'API tidak mengembalikan JSON.'
      );
    }

    if(!res.ok){
      throw new Error(
        out.error||('HTTP '+res.status)
      );
    }

    if(!out.success){
      throw new Error(
        out.error||'Terjadi kesalahan.'
      );
    }

    return out.data;
  }

  const res=await fetch(API_ENDPOINT,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Accept':'application/json'
    },
    body:JSON.stringify({
      action,
      payload
    })
  });

  const text=await res.text();
  let out;

  try{
    out=JSON.parse(text);
  }catch(_){
    throw new Error(
      'API tidak mengembalikan JSON.'
    );
  }

  if(!res.ok){
    throw new Error(
      out.error||('HTTP '+res.status)
    );
  }

  if(!out.success){
    throw new Error(
      out.error||'Terjadi kesalahan.'
    );
  }

  return out.data;
}

function buildNav(){
  const groups=['Monitoring','Pekerjaan','Referensi & Koordinasi','Tools'];
  const html=groups.map((group,gi)=>{
    const items=PAGES.filter(x=>x[2]===group);
    return `${gi?'<div class="nav-divider"></div>':''}<div class="nav-group"><div class="nav-group-label">${esc(group)}</div>${items.map(([key,label])=>`<button class="${state.page===key?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('')}</div>`;
  }).join('');
  qs('#nav').innerHTML=html;
  qs('#mobileNav').innerHTML=PAGES.map(([key,label])=>`<button class="${state.page===key?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('');
}

let __pageRequestSequence=0;

function commitPageUrl(page,projectId,mode='push'){
  if(mode==='none')return;

  const url=new URL(location.href);
  url.searchParams.set('page',page);

  if(projectId){
    url.searchParams.set('project',projectId);
  }else{
    url.searchParams.delete('project');
  }

  history[
    mode==='replace'
      ? 'replaceState'
      : 'pushState'
  ]({},'',url);
}

function navigate(page,replace=false){
  if(!page)return;

  setError('');

  return loadPage({
    targetPage:page,
    targetProjectId:'',
    commitNavigation:true,
    historyMode:replace?'replace':'push'
  });
}

window.addEventListener('popstate',()=>{
  const p=new URLSearchParams(location.search);

  loadPage({
    targetPage:p.get('page')||'workload',
    targetProjectId:p.get('project')||'',
    commitNavigation:true,
    historyMode:'none'
  });
});

async function loadPage(extra={}){
  const requestId=++__pageRequestSequence;

  const targetPage=
    extra.targetPage!==undefined
      ? extra.targetPage
      : state.page;

  const targetProjectId=
    extra.targetProjectId!==undefined
      ? extra.targetProjectId
      : (
          extra.projectId!==undefined
            ? extra.projectId
            : state.projectId
        );

  const targetWeek=
    extra.week!==undefined
      ? extra.week
      : state.week;

  try{
    const nextModel=await api('getPage',{
      page:targetPage,
      week:targetWeek,
      blastId:extra.blastId||'',
      projectId:targetProjectId
    });

    // Ignore an older response if the user clicked another module
    // while this request was still running.
    if(requestId!==__pageRequestSequence)return;

    state.page=targetPage;
    state.projectId=targetProjectId;
    state.model=nextModel;

    if(
      state.page==='workload' &&
      state.model.workload
    ){
      state.week=
        state.model.workload.weekKey||targetWeek||'';
    }

    if(extra.commitNavigation){
      commitPageUrl(
        state.page,
        state.projectId,
        extra.historyMode||'push'
      );
    }

    buildNav();
    renderCurrent();
  }catch(err){
    if(requestId!==__pageRequestSequence)return;

    // Keep the existing module visible. The user only sees the
    // top progress bar while loading; an error message is shown
    // without replacing the current page.
    setError(err.message);
  }
}

function renderCurrent(){
  const map={
    workload:renderWorkload,trend:renderTrend,project:renderProject,taskmatrix:renderTaskMatrix,
    taskrecap:renderTaskRecap,documents:renderDocuments,pics:renderPics,
    blast:renderBlast,apps:renderApps
  };
  (map[state.page]||renderWorkload)();
}

function topbar(title,subtitle,action=''){
  return `<div class="topbar"><div><h1>${esc(title)}</h1><div class="subtitle">${esc(subtitle)}</div></div>${action}</div>`;
}
function stat(label,value,note=''){return `<div class="stat"><div class="stat-label">${esc(label)}</div><div class="stat-value">${esc(value)}</div>${note?`<div class="stat-note">${esc(note)}</div>`:''}</div>`}

function landingStat(icon,label,value,note=''){

    <div class="landing-stat-top">
      <div class="landing-stat-icon">${esc(icon)}</div>

    <div class="landing-stat-value">${esc(value)}</div>
    ${note?`<div class="landing-stat-note">${esc(note)}</div>`:''}
  </div>`;
}


function projectOptions(selected=''){
  const projects=state.bootstrap?.projects||[];
  const active=projects.filter(p=>p.status==='Aktif'), inactive=projects.filter(p=>p.status!=='Aktif');
  let out='<option value="">Tanpa Project</option>';
  if(active.length)out+='<optgroup label="Project Aktif">'+active.map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')+'</optgroup>';
  if(inactive.length)out+='<optgroup label="Project Selesai / Ditunda">'+inactive.map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${esc(p.name)} (${esc(p.status)})</option>`).join('')+'</optgroup>';
  return out;
}
function projectLink(id,name){return id?`<button class="project-link" onclick="openProject('${esc(id)}')">${esc(name||'Project')}</button>`:'—'}
function dateTimeLabel(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

function agendaTimeLabel(item){
  const clock=String(item?.clockLabel||'').trim();
  if(clock && clock!=='—' && clock!=='-') return clock;
  return 'Sepanjang hari';
}

function renderAgendaRows(agenda){
  const rows=(agenda&&agenda.items)||agenda||[];
  if(!rows.length)return'<div class="empty">Tidak ada agenda.</div>';

  return `<div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Tugas</th><th>PIC</th><th>Detail</th><th>Status</th></tr></thead><tbody>${rows.map((x,i)=>{
    const time=agendaTimeLabel(x);
    return `<tr class="${x.isActive?'agenda-active':(x.isNext?'agenda-next':'')}">
      <td><span class="${time==='Sepanjang hari'?'agenda-all-day':''}">${esc(time)}</span></td>
      <td><strong>${esc(x.title)}</strong><div class="sub">${esc(x.program||'')} · ${esc(x.substansi||x.activity||'')}</div></td>
      <td>${esc((x.picList||[]).join(', ')||x.pic||'—')}</td>
      <td><button class="mini" onclick="showTaskDetail('${esc(x.id)}')">Detail</button></td>
      <td><span class="pill ${esc(x.statusKey||x.status||'todo')}">${esc(x.statusLabel||x.status||'')}</span></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

function renderAgendaSwitcher(todayAgenda,tomorrowAgenda){
  const todayRows=(todayAgenda&&todayAgenda.items)||todayAgenda||[];
  const tomorrowRows=(tomorrowAgenda&&tomorrowAgenda.items)||tomorrowAgenda||[];

  window.__agendaData={
    today:todayRows,
    tomorrow:tomorrowRows
  };

  return `<div class="card" id="agendaCard">
    <div class="card-head">
      <div>
        <div class="card-title" id="agendaCardTitle">Agenda Hari Ini</div>
        <div class="card-note" id="agendaCardNote">${todayRows.length} agenda</div>
      </div>
      <div class="agenda-switch" role="group" aria-label="Pilih agenda">
        <button type="button" id="agendaTodayBtn" class="active" onclick="switchAgendaDay('today')">Hari Ini</button>
        <button type="button" id="agendaTomorrowBtn" onclick="switchAgendaDay('tomorrow')">Besok</button>

function trendIsoDate(value){
  const raw=String(value||'').trim();
  if(!raw)return'';
  const m=raw.match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:'';
}
function trendCreatedDate(task){
  return trendIsoDate(task.createdAt)||trendIsoDate(task.startDate)||trendIsoDate(task.endDate)||trendIsoDate(task.due)||trendIsoDate(task.updatedAt);
}
function trendCompletedDate(task){
  const explicit=trendIsoDate(task.completedAt);
  if(explicit)return explicit;
  if(task.status!=='done')return'';
  return trendIsoDate(task.endDate)||trendIsoDate(task.startDate)||trendIsoDate(task.due)||trendIsoDate(task.updatedAt);
}
function trendDateFromKey(key){
  const p=String(key||'').split('-').map(Number);
  return p.length===3&&!p.some(Number.isNaN)?new Date(p[0],p[1]-1,p[2]):null;
}
function trendMonthKey(date){
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');
}
function trendMonthLabel(key,includeYear){
  const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const p=String(key).split('-').map(Number);
  if(p.length!==2)return key;
  return months[p[1]-1]+(includeYear?' '+String(p[0]).slice(-2):'');
}
function trendTasks(){
  return j(state.model.trendWork?.tasksJson);
}
function trendFilteredTasks(){
  const f=state.trendFilters;
  return trendTasks().filter(t=>
    (!f.program||t.program===f.program)&&
    (!f.activity||t.substansi===f.activity)
  );
}
function trendMonthKeys(){
  const tasks=trendTasks();
  const today=new Date();
  const year=today.getFullYear(),month=today.getMonth();
  const period=state.trendFilters.period||'year';

  if(period==='3'||period==='6'){
    const n=Number(period),keys=[];
    for(let i=n-1;i>=0;i--)keys.push(trendMonthKey(new Date(year,month-i,1)));
    return keys;
  }
  if(period==='year'){
    return Array.from({length:month+1},(_,i)=>trendMonthKey(new Date(year,i,1)));
  }

  const dates=[];
  tasks.forEach(t=>{
    const a=trendCreatedDate(t),b=trendCompletedDate(t);
    if(a)dates.push(a);if(b)dates.push(b);
  });
  if(!dates.length)return[trendMonthKey(new Date(year,month,1))];
  dates.sort();
  const first=trendDateFromKey(dates[0]);
  if(!first)return[trendMonthKey(new Date(year,month,1))];

  const keys=[];
  let cursor=new Date(first.getFullYear(),first.getMonth(),1);
  const limit=new Date(year,month,1);
  while(cursor<=limit){
    keys.push(trendMonthKey(cursor));
    cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
  }
  return keys;
}
function setTrendPeriod(period){
  state.trendFilters.period=period;
  renderTrend();
}
function trendFilter(){
  state.trendFilters.program=qs('#trendProgram')?.value||'';
  state.trendFilters.activity=qs('#trendActivity')?.value||'';

function resetTrend(){
  state.trendFilters={period:'year',program:'',activity:''};
  renderTrend();
}
function trendBuildBuckets(tasks,keys){
  const map={};
  keys.forEach(k=>map[k]={key:k,incoming:0,completed:0});
  tasks.forEach(t=>{
    const a=trendCreatedDate(t),b=trendCompletedDate(t);
    if(a&&map[a.slice(0,7)])map[a.slice(0,7)].incoming++;
    if(b&&map[b.slice(0,7)])map[b.slice(0,7)].completed++;
  });
  return keys.map(k=>map[k]);
}
function trendTimeliness(task){
  if(!task||task.status!=='done')return null;
  const completed=trendIsoDate(task.completedAt);
  const deadline=trendIsoDate(task.endDate||task.startDate||task.due);
  if(!completed||!deadline)return null;
  return completed<=deadline;
}

function renderTrendDashboard(){
  const tasks=trendFilteredTasks();
  const keys=trendMonthKeys();
  const buckets=trendBuildBuckets(tasks,keys);
  const keySet=new Set(keys);

  const incoming=tasks.filter(t=>{const d=trendCreatedDate(t);return d&&keySet.has(d.slice(0,7))});
  const completed=tasks.filter(t=>{const d=trendCompletedDate(t);return d&&keySet.has(d.slice(0,7))});
  const overdue=incoming.filter(t=>!!t.overdue).length;
  const timed=completed.map(trendTimeliness).filter(v=>v!==null);
  const ontime=timed.filter(Boolean).length;

  qs('#trendTotalIncoming').textContent=incoming.length;
  qs('#trendTotalCompleted').textContent=completed.length;
  qs('#trendOverdue').textContent=overdue;
  qs('#trendOnTimeRate').textContent=timed.length?Math.round(ontime/timed.length*100)+'%':'—';
  qs('#trendOnTimeNote').textContent=timed.length?ontime+' dari '+timed.length+' tugas selesai tepat waktu':'Belum ada tugas selesai dengan target dan waktu selesai tercatat';

  renderTrendVolume(buckets);
  renderTrendMonthlyComposition('trendProgramMonthly','trendProgramLegend',incoming,keys,'program',state.bootstrap?.programs||[],TREND_PROGRAM_COLORS);
  renderTrendMonthlyComposition('trendActivityMonthly','trendActivityLegend',incoming,keys,'substansi',state.bootstrap?.activities||[],TREND_ACTIVITY_COLORS);

}

function renderTrendVolume(buckets){
  const el=qs('#trendVolumeChart');
  if(!el)return;
  if(!buckets.length){el.innerHTML='<div class="empty">Belum ada data historis.</div>';return}
  const max=Math.max(1,...buckets.map(x=>Math.max(x.incoming,x.completed)));
  const years=new Set(buckets.map(x=>x.key.slice(0,4))),includeYear=years.size>1;
  el.style.minWidth=Math.max(620,buckets.length*64)+'px';
  el.innerHTML=buckets.map(x=>{
    const a=x.incoming?Math.max(4,x.incoming/max*100):1;
    const b=x.completed?Math.max(4,x.completed/max*100):1;
    return `<div class="trend-month-group"><div class="trend-bar-pair"><div class="trend-bar incoming" title="${x.incoming} tugas masuk" style="height:${a}%"></div><div class="trend-bar completed" title="${x.completed} tugas selesai" style="height:${b}%"></div></div><div class="trend-month-label">${trendMonthLabel(x.key,includeYear)}</div></div>`;
  }).join('');
}

function renderTrendMonthlyComposition(elementId,legendId,tasks,keys,field,master,colors){
  const el=qs('#'+elementId),legend=qs('#'+legendId);
  if(!el||!legend)return;
  const years=new Set(keys.map(k=>k.slice(0,4))),includeYear=years.size>1;
  const order=[...master,'Lain-lain','Belum Diklasifikasikan'].filter((x,i,a)=>x&&a.indexOf(x)===i);
  const rows=keys.map(key=>{
    const monthTasks=tasks.filter(t=>{const d=trendCreatedDate(t);return d&&d.slice(0,7)===key});
    const counts={};
    monthTasks.forEach(t=>{const v=t[field]||'Belum Diklasifikasikan';counts[v]=(counts[v]||0)+1});
    return{key,total:monthTasks.length,counts};
  });
  if(!rows.some(r=>r.total)){el.innerHTML='<div class="empty">Belum ada data komposisi pada periode ini.</div>';legend.innerHTML='';return}

  el.innerHTML=rows.map(r=>{
    const segments=order.map(name=>{
      const count=r.counts[name]||0;if(!count||!r.total)return'';
      const pct=count/r.total*100;
      return `<span class="trend-stack-segment" style="width:${pct.toFixed(2)}%;background:${colors[name]||'#a1a1aa'}" title="${esc(name)}: ${count} tugas (${Math.round(pct)}%)"></span>`;
    }).join('');
    return `<div class="trend-month-row"><div class="trend-month-row-label">${trendMonthLabel(r.key,includeYear)}</div><div class="trend-stack">${segments}</div><div class="trend-month-row-total">${r.total||'—'}</div></div>`;
  }).join('');

  const present=order.filter(name=>rows.some(r=>r.counts[name]));
  legend.innerHTML=present.map(name=>`<span class="trend-monthly-legend-item"><span class="trend-monthly-swatch" style="background:${colors[name]||'#a1a1aa'}"></span>${esc(name)}</span>`).join('');
}

function setTrendTeamMetric(metric){
  TREND_TEAM_METRIC=metric;
  renderTrend();
}
function trendTaskDeadline(task){
  return trendIsoDate(task.endDate||task.startDate||task.due);
}
function trendLateAnchorDate(task){
  const deadline=trendTaskDeadline(task);
  if(!deadline)return'';
  const completed=trendIsoDate(task.completedAt);
  if(completed)return completed>deadline?deadline:'';
  const today=new Date().toISOString().slice(0,10);
  return task.status!=='done'&&deadline<today?deadline:'';
}
function trendMetricAnchorDate(task,metric){
  if(metric==='completed')return trendCompletedDate(task);
  if(metric==='late')return trendLateAnchorDate(task);
  return trendCreatedDate(task);
}
function trendMetricLabel(metric){
  return metric==='completed'?'Selesai':metric==='late'?'Terlambat':'Penugasan';
}
function trendHeatLevel(value,max){
  if(!value||!max)return 0;
  const r=value/max;
  return r<=.25?1:r<=.5?2:r<=.75?3:4;
}
function renderTrendTeamHeatmap(tasks,keys){
  const el=qs('#trendTeamHeatmap');
  if(!el)return;
  if(!keys.length){el.innerHTML='<div class="empty">Belum ada data historis.</div>';return}
  const team=state.bootstrap?.pics||[];
  const years=new Set(keys.map(k=>k.slice(0,4))),includeYear=years.size>1;
  const rows=team.map(name=>{
    const months=keys.map(key=>{
      let count=0;
      tasks.forEach(t=>{
        if(!(t.picList||[]).includes(name))return;
        const d=trendMetricAnchorDate(t,TREND_TEAM_METRIC);
        if(d&&d.slice(0,7)===key)count++;
      });
      return{key,count};
    });
    return{name,months,total:months.reduce((s,x)=>s+x.count,0)};
  });
  let max=0;rows.forEach(r=>r.months.forEach(x=>{if(x.count>max)max=x.count}));
  const header=`<div class="trend-team-grid trend-team-header"><div class="trend-team-name-head">Anggota Tim</div>${keys.map(k=>`<div class="trend-team-month-head">${trendMonthLabel(k,includeYear)}</div>`).join('')}<div class="trend-team-total-head">Total</div></div>`;
  const body=rows.map(r=>`<div class="trend-team-grid trend-team-row"><div class="trend-team-name">${esc(r.name)}</div>${r.months.map(x=>`<div class="trend-team-cell heat-${trendHeatLevel(x.count,max)}" title="${esc(r.name)} · ${trendMonthLabel(x.key,includeYear)} · ${trendMetricLabel(TREND_TEAM_METRIC)}: ${x.count}">${x.count}</div>`).join('')}<div class="trend-team-total">${r.total}</div></div>`).join('');
  el.style.minWidth=Math.max(760,160+keys.length*58+65)+'px';
  el.style.setProperty('--trend-month-count',String(keys.length));
  el.innerHTML=header+body;
}

function openDocumentForm(d={}){openModal(d.id?'Edit Dokumen':'Tambah Dokumen',`<div class="form-grid"><div class="field full"><label>Nama Dokumen *</label><input id="dName" value="${esc(d.name||'')}"></div><div class="field"><label>Program *</label><select id="dProgram">${(state.bootstrap?.programs||[]).map(v=>`<option ${d.program===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Project</label><select id="dProject">${projectOptions(d.projectId||state.projectId||'')}</select><div class="helper">Opsional. Dokumen tetap berada di Inventaris dan otomatis muncul pada Project.</div></div><div class="field"><label>Tag *</label><input id="dTag" value="${esc(d.tag||'')}"></div><div class="field"><label>Label Link</label><input id="dLabel" value="${esc(d.linkLabel||'')}"></div><div class="field"><label>URL</label><input id="dUrl" value="${esc(d.url||'')}"></div><div class="field full"><label>Keterangan</label><textarea id="dNotes">${esc(d.notes||'')}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveDocument('${esc(d.id||'')}')">Simpan</button>`)}
async function saveDocument(id){try{await api('saveDocument',{id,name:qs('#dName').value,program:qs('#dProgram').value,projectId:qs('#dProject').value,tag:qs('#dTag').value,linkLabel:qs('#dLabel').value,url:qs('#dUrl').value,notes:qs('#dNotes').value});closeModal();showToast('Dokumen disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deleteDocument(id){if(!confirm('Hapus dokumen ini?'))return;try{await api('deleteDocument',{id});showToast('Dokumen dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}

function openPicForm(p={}){openModal(p.id?'Edit PIC':'Tambah PIC',`<div class="form-grid"><div class="field full"><label>Nama Instansi *</label><input id="pInst" value="${esc(p.namaInstansi||'')}"></div><div class="field"><label>Kategori *</label><select id="pCat">${['Kabupaten','Kota','Provinsi','Kementerian/Lembaga'].map(v=>`<option ${p.kategoriInstansi===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>PIC Yanlik</label><select id="pYan"><option value="">Pilih</option>${(state.bootstrap?.pics||[]).map(v=>`<option ${p.namaPicYanlik===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Nama PIC Instansi</label><input id="pName" value="${esc(p.namaPicInstansi||'')}"></div><div class="field"><label>Nomor HP</label><input id="pPhone" value="${esc(p.nomorHandphonePicInstansi||'')}"></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="savePic('${esc(p.id||'')}')">Simpan</button>`)}
async function savePic(id){try{await api('savePic',{id,namaInstansi:qs('#pInst').value,kategoriInstansi:qs('#pCat').value,namaPicYanlik:qs('#pYan').value,namaPicInstansi:qs('#pName').value,nomorHandphonePicInstansi:qs('#pPhone').value});closeModal();showToast('PIC disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deletePic(id){if(!confirm('Hapus data PIC?'))return;try{await api('deletePic',{id});showToast('PIC dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}

function openAppForm(a={}){openModal(a.id?'Edit Aplikasi':'Tambah Aplikasi',`<div class="form-grid"><div class="field full"><label>Nama Aplikasi *</label><input id="aName" value="${esc(a.name||'')}"></div><div class="field"><label>Singkatan/Icon *</label><input id="aShort" maxlength="5" value="${esc(a.shortName||'')}"></div><div class="field"><label>Program *</label><select id="aProgram">${(state.bootstrap?.programs||[]).map(v=>`<option ${a.program===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Kategori *</label><select id="aCategory">${(state.bootstrap?.appCategories||[]).map(v=>`<option ${a.category===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Badge</label><input id="aBadge" value="${esc(a.badge||'')}"></div><div class="field full"><label>Link Aplikasi *</label><input id="aUrl" value="${esc(a.url||'')}"></div><div class="field full"><label>Deskripsi</label><textarea id="aDesc">${esc(a.description||'')}</textarea></div><div class="field full"><label><input type="checkbox" id="aActive" ${a.active!==false?'checked':''}> Aktif</label></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveApp('${esc(a.id||'')}')">Simpan</button>`)}
async function saveApp(id){try{await api('saveApp',{id,name:qs('#aName').value,shortName:qs('#aShort').value,program:qs('#aProgram').value,category:qs('#aCategory').value,badge:qs('#aBadge').value,url:qs('#aUrl').value,description:qs('#aDesc').value,active:qs('#aActive').checked});closeModal();showToast('Aplikasi disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}

function openBlastForm(b={}){const pics=state.model.pics||[];openModal(b.id?'Edit Blast Project':'Project Baru',`<div class="form-grid"><div class="field full"><label>Nama Project *</label><input id="bName" value="${esc(b.namaProject||'')}"></div><div class="field"><label>Channel</label><select id="bChannel">${['WhatsApp','Email','WhatsApp + Email'].map(v=>`<option ${b.channel===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="bStatus">${['Draft','Aktif','Selesai'].map(v=>`<option ${b.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Pilih Instansi *</label><div style="max-height:220px;overflow:auto;border:1px solid var(--line);padding:8px;border-radius:7px">${pics.map(p=>`<label style="display:block;font-size:11px;margin:4px 0"><input type="checkbox" name="bPic" value="${esc(p.id)}"> ${esc(p.namaInstansi)} · ${esc(p.namaPicYanlik||'')}</label>`).join('')}</div></div><div class="field full"><label>Pesan WhatsApp</label><textarea id="bWa">${esc(b.whatsappMessage||'')}</textarea></div><div class="field full"><label>Subjek Email</label><input id="bSubject" value="${esc(b.emailSubject||'')}"></div><div class="field full"><label>Isi Email</label><textarea id="bEmail">${esc(b.emailBody||'')}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveBlast('${esc(b.id||'')}')">Simpan</button>`)}
async function saveBlast(id){try{await api('saveBlast',{id,namaProject:qs('#bName').value,channel:qs('#bChannel').value,status:qs('#bStatus').value,selectedPicIds:qsa('input[name="bPic"]:checked').map(x=>x.value),whatsappMessage:qs('#bWa').value,emailSubject:qs('#bSubject').value,emailBody:qs('#bEmail').value});closeModal();showToast('Blast Project disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deleteBlast(id){if(!confirm('Hapus Blast Project?'))return;try{await api('deleteBlast',{id});showToast('Blast Project dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}
async function toggleRecipientSent(id,sent,projectId){try{await api('setBlastSent',{recipientId:id,sent});await viewBlast(projectId)}catch(e){showToast(e.message,true)}}
async function saveRecipientEmail(id,email){try{await api('saveBlastEmail',{recipientId:id,email});showToast('Email disimpan.')}catch(e){showToast(e.message,true)}}

async function init(){
  buildNav();
  try{state.bootstrap=await api('bootstrap');await loadPage()}
  catch(e){setError(e.message);qs('#page').innerHTML=`<div class="card"><div class="card-body"><strong>Frontend belum terhubung ke API.</strong><div class="sub" style="margin-top:6px">Pastikan Environment Variable Netlify bernama APPS_SCRIPT_URL dan nilainya adalah URL Apps Script yang berakhiran /exec.</div></div></div>`}
}
init();
</script>
</body>
