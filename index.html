<style>

.load.clickable{cursor:pointer;background:#fff}.load.clickable:hover{box-shadow:0 0 0 2px #e4e4e7}.load.clickable.l1{background:#f0fdf4}.load.clickable.l2{background:#eff6ff}.load.clickable.l3{background:#fffbeb}.load.clickable.l4,.load.clickable.l5{background:#fef2f2}

/* Minimal global loading progress */
.global-progress{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:3px;
  z-index:500;
  pointer-events:none;
  opacity:0;
  background:transparent;
  transition:opacity .15s ease;
}
.global-progress.show{opacity:1}
.global-progress-bar{
  width:0;
  height:100%;
  background:#18181b;
  border-radius:0 999px 999px 0;
  box-shadow:0 1px 5px rgba(24,24,27,.14);
  transition:width .28s ease;
}
@media(prefers-reduced-motion:reduce){
  .global-progress,
  .global-progress-bar{transition:none}
}

<body>

<div id="globalProgress" class="global-progress" aria-hidden="true">
  <div id="globalProgressBar" class="global-progress-bar"></div>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand-wrap"><div class="brand-mark">IW</div><div class="brand-copy">Rekap Kerja Asdep PPP<small>Project, tugas, dokumen, dan tindak lanjut tim</small></div></div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
    <div id="errorBox"></div>
    <div id="page"><div class="loading">Memuat aplikasi…</div></div>
  </main>
</div>
<div class="mobile-nav" id="mobileNav"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="modalTitle"></div><button class="btn" onclick="closeModal()">Tutup</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/*
  Netlify frontend v1.44 — single agenda switcher + all-day task label + loading progress.
  Netlify frontend.
  Recommended production setup:
  - index.html is hosted by Netlify/GitHub
  - POST /api is proxied by a Netlify Function to Apps Script
  - Code.gs above is deployed as Apps Script Web App backend

  If you already have your own proxy endpoint, change API_ENDPOINT below.
*/
const API_ENDPOINT = '/api';


let __activeRequests=0;
let __progressTimer=null;

function startGlobalProgress(){
  __activeRequests++;
  if(__activeRequests!==1) return;

  const shell=document.getElementById('globalProgress');
  const bar=document.getElementById('globalProgressBar');
  if(!shell||!bar) return;

  clearTimeout(__progressTimer);
  shell.classList.add('show');
  bar.style.width='10%';

  requestAnimationFrame(()=>{
    bar.style.width='62%';
  });

  __progressTimer=setTimeout(()=>{
    if(__activeRequests>0) bar.style.width='82%';
  },650);
}

function finishGlobalProgress(){
  __activeRequests=Math.max(0,__activeRequests-1);
  if(__activeRequests>0) return;

  const shell=document.getElementById('globalProgress');
  const bar=document.getElementById('globalProgressBar');
  if(!shell||!bar) return;

  clearTimeout(__progressTimer);
  bar.style.width='100%';

  setTimeout(()=>{
    shell.classList.remove('show');
    bar.style.width='0';
  },180);
}

const __nativeFetch=window.fetch.bind(window);
window.fetch=async function(){
  startGlobalProgress();
  try{
    return await __nativeFetch(...arguments);
  }finally{
    finishGlobalProgress();
  }
};


const PAGES=[
  ['workload','Ringkasan Pekerjaan','Monitoring'],
  ['trend','Tren Pekerjaan','Monitoring'],
  ['project','Project','Pekerjaan'],
  ['taskmatrix','Kelola Tugas','Pekerjaan'],
  ['taskrecap','Tugas Saya','Pekerjaan'],
  ['documents','Dokumen','Referensi & Koordinasi'],
  ['pics','PIC & Kontak Instansi','Referensi & Koordinasi'],
  ['blast','Blast & Komunikasi','Referensi & Koordinasi'],
  ['apps','Aplikasi Tim','Tools']
];

const state={
  page:new URLSearchParams(location.search).get('page')||'workload',
  model:null,
  bootstrap:null,
  week:'',
  trendFilters:{period:'all',program:'',activity:''},
  projectId:new URLSearchParams(location.search).get('project')||'',
  projectTimeline:{q:'',type:'',limit:20}
};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function j(v){try{return JSON.parse(v||'[]')}catch(_){return[]}}
function qs(sel,root=document){return root.querySelector(sel)}
function qsa(sel,root=document){return [...root.querySelectorAll(sel)]}
function statusLabel(s){return s==='done'?'Selesai':s==='progress'?'Sedang Dikerjakan':'Perlu Dikerjakan'}
function priorityClass(p){return p==='Tinggi'?'high':p==='Rendah'?'low':'medium'}
function fmtDate(v){if(!v)return'—';const d=new Date(v.length===10?v+'T00:00:00':v);return isNaN(d)?v:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function showToast(msg,error=false){const t=qs('#toast');t.textContent=msg;t.className='toast show'+(error?' error-toast':'');setTimeout(()=>t.className='toast',2800)}
function setError(msg=''){qs('#errorBox').innerHTML=msg?`<div class="error">${esc(msg)}</div>`:''}

async function api(action,payload={}){
  const READ_ACTIONS=new Set([
    'bootstrap',
    'getPage',
    'taskDetail'
  ]);

  if(READ_ACTIONS.has(action)){
    const params=new URLSearchParams();
    params.set('action',action);

    Object.entries(payload||{}).forEach(([key,value])=>{
      if(value===undefined||value===null||value==='') return;
      params.set(key,String(value));
    });

    const res=await fetch(
      API_ENDPOINT+'?'+params.toString(),
      {
        method:'GET',
        headers:{
          'Accept':'application/json'
        }
      }
    );

    const text=await res.text();
    let out;

    try{
      out=JSON.parse(text);
    }catch(_){
      throw new Error(
        'API tidak mengembalikan JSON.'
      );
    }

    if(!res.ok){
      throw new Error(
        out.error||('HTTP '+res.status)
      );
    }

    if(!out.success){
      throw new Error(
        out.error||'Terjadi kesalahan.'
      );
    }

    return out.data;
  }

  const res=await fetch(API_ENDPOINT,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Accept':'application/json'
    },
    body:JSON.stringify({
      action,
      payload
    })
  });

  const text=await res.text();
  let out;

  try{
    out=JSON.parse(text);
  }catch(_){
    throw new Error(
      'API tidak mengembalikan JSON.'
    );
  }

  if(!res.ok){
    throw new Error(
      out.error||('HTTP '+res.status)
    );
  }

  if(!out.success){
    throw new Error(
      out.error||'Terjadi kesalahan.'
    );
  }

  return out.data;
}

function buildNav(){
  const groups=['Monitoring','Pekerjaan','Referensi & Koordinasi','Tools'];
  const html=groups.map((group,gi)=>{
    const items=PAGES.filter(x=>x[2]===group);
    return `${gi?'<div class="nav-divider"></div>':''}<div class="nav-group"><div class="nav-group-label">${esc(group)}</div>${items.map(([key,label])=>`<button class="${state.page===key?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('')}</div>`;
  }).join('');
  qs('#nav').innerHTML=html;
  qs('#mobileNav').innerHTML=PAGES.map(([key,label])=>`<button class="${state.page===key?'active':''}" onclick="navigate('${key}')">${label}</button>`).join('');
}

function navigate(page,replace=false){
  state.page=page;state.model=null;setError('');
  state.projectId='';
  const url=new URL(location.href);url.searchParams.set('page',page);url.searchParams.delete('project');
  history[replace?'replaceState':'pushState']({},'',url);
  buildNav();loadPage();
}
window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);state.page=p.get('page')||'workload';state.projectId=p.get('project')||'';buildNav();loadPage()});

async function loadPage(extra={}){
  qs('#page').innerHTML='<div class="loading">Memuat data…</div>';
  try{
    state.model=await api('getPage',{
      page:state.page,
      week:extra.week??state.week,
      blastId:extra.blastId||'',
      projectId:extra.projectId??state.projectId
    });
    if(state.page==='workload' && state.model.workload)state.week=state.model.workload.weekKey||'';
    renderCurrent();
  }catch(err){setError(err.message);qs('#page').innerHTML='<div class="empty">Data gagal dimuat.</div>'}
}

function renderCurrent(){
  const map={
    workload:renderWorkload,trend:renderTrend,project:renderProject,taskmatrix:renderTaskMatrix,
    taskrecap:renderTaskRecap,documents:renderDocuments,pics:renderPics,
    blast:renderBlast,apps:renderApps
  };
  (map[state.page]||renderWorkload)();
}

function topbar(title,subtitle,action=''){
  return `<div class="topbar"><div><h1>${esc(title)}</h1><div class="subtitle">${esc(subtitle)}</div></div>${action}</div>`;
}
function stat(label,value,note=''){return `<div class="stat"><div class="stat-label">${esc(label)}</div><div class="stat-value">${esc(value)}</div>${note?`<div class="stat-note">${esc(note)}</div>`:''}</div>`}

function renderAgendaSwitcher(todayAgenda,tomorrowAgenda){
  const todayRows=(todayAgenda&&todayAgenda.items)||todayAgenda||[];
  const tomorrowRows=(tomorrowAgenda&&tomorrowAgenda.items)||tomorrowAgenda||[];

  window.__agendaData={
    today:todayRows,
    tomorrow:tomorrowRows
  };

  return `<div class="card" id="agendaCard">
    <div class="card-head">
      <div>
        <div class="card-title" id="agendaCardTitle">Agenda Hari Ini</div>
        <div class="card-note" id="agendaCardNote">${todayRows.length} agenda</div>
      </div>
      <div class="agenda-switch" role="group" aria-label="Pilih agenda">
        <button type="button" id="agendaTodayBtn" class="active" onclick="switchAgendaDay('today')">Hari Ini</button>
        <button type="button" id="agendaTomorrowBtn" onclick="switchAgendaDay('tomorrow')">Besok</button>
      </div>
    </div>
    <div id="agendaCardBody">${renderAgendaRows(todayRows)}</div>
  </div>`;
}

function switchAgendaDay(day){
  const mode=day==='tomorrow'?'tomorrow':'today';
  const rows=(window.__agendaData&&window.__agendaData[mode])||[];

  const title=qs('#agendaCardTitle');
  const note=qs('#agendaCardNote');
  const body=qs('#agendaCardBody');
  const todayBtn=qs('#agendaTodayBtn');
  const tomorrowBtn=qs('#agendaTomorrowBtn');

  if(title)title.textContent=mode==='today'?'Agenda Hari Ini':'Agenda Besok';
  if(note)note.textContent=rows.length+' agenda';
  if(body)body.innerHTML=renderAgendaRows(rows);

  if(todayBtn)todayBtn.classList.toggle('active',mode==='today');
  if(tomorrowBtn)tomorrowBtn.classList.toggle('active',mode==='tomorrow');
}

function renderTrend(){
  const tasks=j(state.model.trendWork?.tasksJson);
  const programs=['',...(state.bootstrap?.programs||[])], acts=['',...(state.bootstrap?.activities||[])];
  const f=state.trendFilters;
  const filtered=tasks.filter(t=>(!f.program||t.program===f.program)&&(!f.activity||t.substansi===f.activity));
  const done=filtered.filter(t=>t.status==='done').length, overdue=filtered.filter(t=>t.overdue).length;
  const ontime=filtered.filter(t=>t.status==='done'&&t.completedAt&&t.endDate&&String(t.completedAt).slice(0,10)<=t.endDate).length;
  const monthly={};
  filtered.forEach(t=>{const d=(t.createdAt||t.startDate||t.updatedAt||'').slice(0,7);if(!d)return;monthly[d]=monthly[d]||{in:0,done:0};monthly[d].in++;if(t.status==='done')monthly[d].done++});
  const monthRows=Object.keys(monthly).sort().slice(-12);
  qs('#page').innerHTML=topbar('Tren Pekerjaan','Analisis historis penugasan dan penyelesaian.')+
  `<div class="toolbar"><select id="trendProgram" onchange="trendFilter()">${programs.map(x=>`<option value="${esc(x)}" ${x===f.program?'selected':''}>${esc(x||'Semua Program')}</option>`).join('')}</select><select id="trendActivity" onchange="trendFilter()">${acts.map(x=>`<option value="${esc(x)}" ${x===f.activity?'selected':''}>${esc(x||'Semua Aktivitas')}</option>`).join('')}</select><div></div><button class="btn" onclick="resetTrend()">Reset</button></div>`+
  `<div class="stats">${stat('Total Tugas Masuk',filtered.length)}${stat('Total Tugas Selesai',done)}${stat('Terlambat',overdue)}${stat('Ketepatan Waktu',done?Math.round(ontime/done*100)+'%':'—')}</div>`+
  `<div class="card"><div class="card-head"><div><div class="card-title">Ringkasan Bulanan</div><div class="card-note">Tugas masuk dan selesai.</div></div></div><div class="table-wrap"><table><thead><tr><th>Bulan</th><th>Masuk</th><th>Selesai</th></tr></thead><tbody>${monthRows.map(k=>`<tr><td>${esc(k)}</td><td>${monthly[k].in}</td><td>${monthly[k].done}</td></tr>`).join('')}</tbody></table></div></div>`+
  renderTeamTrend(filtered);
}

    <div class="field"><label>Program *</label><select id="fProgram"><option value="">Pilih</option>${(state.bootstrap?.programs||[]).map(v=>`<option ${x.program===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="field"><label>Aktivitas *</label><select id="fActivity"><option value="">Pilih</option>${(state.bootstrap?.activities||[]).map(v=>`<option ${x.substansi===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="field full"><label>Project</label><select id="fProject">${projectOptions(x.projectId||prefillProjectId||state.projectId||'')}</select><div class="helper">Opsional. Project menghubungkan tugas dengan dokumen, sumber, dan riwayat kerja.</div></div>
    <div class="field"><label>Tag *</label><input id="fTag" value="${esc(x.tag||'')}"></div>
    <div class="field"><label>Pembuat Tugas</label><select id="fAssigner"><option value="">Pilih</option>${(state.bootstrap?.pics||[]).map(v=>`<option ${x.taskAssigner===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="field full"><label>PIC *</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">${(state.bootstrap?.pics||[]).map(v=>`<label style="font-weight:400"><input type="checkbox" name="fPic" value="${esc(v)}" ${(x.picList||[]).includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}</div></div>
    <div class="field"><label>Jenis Waktu</label><select id="fTimeType" onchange="toggleTaskDates()"><option value="none" ${x.timeType==='none'?'selected':''}>Tanpa Tanggal</option><option value="date" ${x.timeType==='date'?'selected':''}>Tanggal</option><option value="period" ${x.timeType==='period'?'selected':''}>Periode</option></select></div>
    <div class="field"><label>Hari Pelaksanaan</label><select id="fDayMode"><option value="workdays" ${x.dayMode!=='all_days'?'selected':''}>Hari Kerja</option><option value="all_days" ${x.dayMode==='all_days'?'selected':''}>Semua Hari</option></select></div>
    <div class="field task-date"><label>Tanggal Mulai</label><input type="date" id="fStartDate" value="${esc(x.startDate||'')}"></div>
    <div class="field task-date"><label>Tanggal Selesai</label><input type="date" id="fEndDate" value="${esc(x.endDate||'')}"></div>
    <div class="field task-date"><label>Jam Mulai</label><input type="time" id="fStartTime" value="${esc(x.startTime||'')}"></div>
    <div class="field task-date"><label>Jam Selesai</label><input type="time" id="fEndTime" value="${esc(x.endTime||'')}"></div>
    <div class="field"><label>Prioritas</label><select id="fPriority">${['Rendah','Sedang','Tinggi'].map(v=>`<option ${x.priority===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>Status</label><select id="fStatus"><option value="todo" ${x.status==='todo'?'selected':''}>Perlu Dikerjakan</option><option value="progress" ${x.status==='progress'?'selected':''}>Sedang Dikerjakan</option><option value="done" ${x.status==='done'?'selected':''}>Selesai</option></select></div>
    <div class="field full"><label>Deskripsi</label><textarea id="fDesc">${esc(x.description||'')}</textarea></div>
  </div>`;
  openModal(x.id?'Edit Tugas':'Buat Tugas',body,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveTaskForm('${esc(x.id||'')}')">Simpan Tugas</button>`);
  toggleTaskDates();
}
function toggleTaskDates(){const show=qs('#fTimeType')?.value!=='none';qsa('.task-date').forEach(el=>el.style.display=show?'block':'none')}
async function saveTaskForm(id){
  try{
    const payload={id,title:qs('#fTitle').value,program:qs('#fProgram').value,projectId:qs('#fProject').value,substansi:qs('#fActivity').value,tag:qs('#fTag').value,pic:qsa('input[name="fPic"]:checked').map(x=>x.value),picEmail:'',taskAssigner:qs('#fAssigner').value,taskAssignerOption:qs('#fAssigner').value,timeType:qs('#fTimeType').value,startDate:qs('#fStartDate').value,endDate:qs('#fEndDate').value,startTime:qs('#fStartTime').value,endTime:qs('#fEndTime').value,dayMode:qs('#fDayMode').value,priority:qs('#fPriority').value,status:qs('#fStatus').value,description:qs('#fDesc').value,resultText:''};
    await api('saveTask',payload);closeModal();showToast('Tugas berhasil disimpan.');await loadPage()
  }catch(e){showToast(e.message,true)}
}
async function setTaskStatus(id,status,recap=false){try{await api('updateTaskStatus',{id,status});showToast('Status diperbarui.');await loadPage();if(recap)setTimeout(renderSelectedRecap,20)}catch(e){showToast(e.message,true)}}
function completeTask(id,recap=false){openModal('Selesaikan Tugas',`<div class="field"><label>Hasil Penyelesaian *</label><textarea id="completeResult"></textarea></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="submitComplete('${esc(id)}',${recap})">Simpan</button>`)}
async function submitComplete(id,recap){try{await api('completeTask',{id,resultText:qs('#completeResult').value});closeModal();showToast('Tugas diselesaikan.');await loadPage();if(recap)setTimeout(renderSelectedRecap,20)}catch(e){showToast(e.message,true)}}
async function deleteTask(id){if(!confirm('Hapus tugas ini?'))return;try{await api('deleteTask',{id});showToast('Tugas dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}
async function showTaskDetail(id){try{const d=await api('taskDetail',{taskId:id});openModal('Detail Tugas',`<div class="form-grid"><div class="field full"><label>Judul</label><strong>${esc(d.title)}</strong></div><div class="field"><label>Program</label>${esc(d.program)}</div><div class="field"><label>Project</label>${d.projectId?projectLink(d.projectId,d.projectName):'—'}</div><div class="field"><label>Aktivitas</label>${esc(d.activity)}</div><div class="field"><label>Tag</label>${esc(d.tag)}</div><div class="field"><label>Status</label>${esc(d.statusLabel)}</div><div class="field full"><label>PIC</label>${esc((d.picList||[]).join(', '))}</div><div class="field full"><label>Waktu</label>${esc(d.timeLabel)}</div><div class="field full"><label>Deskripsi</label>${esc(d.description||'—')}</div><div class="field full"><label>Hasil</label>${esc(d.resultText||'—')}</div><div class="field full"><label>Lampiran Tugas</label>${attachmentList(d.taskAttachments,true)}<div class="row-actions" style="margin-top:7px"><button class="mini" onclick="openAttachmentForm('${esc(d.id)}','task')">+ Lampiran</button></div></div><div class="field full"><label>Lampiran Hasil</label>${attachmentList(d.resultAttachments,true)}<div class="row-actions" style="margin-top:7px"><button class="mini" onclick="openAttachmentForm('${esc(d.id)}','result')">+ Lampiran</button><button class="mini" onclick="createResultDoc('${esc(d.id)}')">+ Google Docs</button></div></div></div>`,`<button class="btn" onclick="closeModal()">Tutup</button>`)}catch(e){showToast(e.message,true)}}
function attachmentList(items,managed=false){return items&&items.length?items.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;margin:4px 0"><span>${a.driveUrl?`<a target="_blank" rel="noopener" href="${esc(a.driveUrl)}">${esc(a.fileName)}</a>`:esc(a.fileName)}</span>${managed?`<button class="mini danger" onclick="deleteAttachment('${esc(a.id)}')">Hapus</button>`:''}</div>`).join(''):'—'}

function openAttachmentForm(taskId,type){openModal('Tambah Lampiran',`<div class="form-grid"><div class="field full"><label>Jenis Lampiran</label><select id="attMode"><option value="link">Link</option><option value="file">Upload File</option></select></div><div class="field full"><label>Judul / Nama File</label><input id="attName"></div><div class="field full"><label>URL (untuk Link)</label><input id="attUrl" placeholder="https://..."></div><div class="field full"><label>File (maks. 8 MB)</label><input id="attFile" type="file"></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveAttachment('${esc(taskId)}','${esc(type)}')">Simpan</button>`)}
async function saveAttachment(taskId,type){try{const mode=qs('#attMode').value;if(mode==='link'){await api('createLinkAttachment',{taskId,attachmentType:type,title:qs('#attName').value,url:qs('#attUrl').value})}else{const f=qs('#attFile').files[0];if(!f)throw new Error('Pilih file.');const data=await fileToBase64(f);await api('uploadAttachment',{taskId,attachmentType:type,fileName:qs('#attName').value||f.name,mimeType:f.type||'application/octet-stream',sizeBytes:f.size,base64:data})}closeModal();showToast('Lampiran ditambahkan.');await showTaskDetail(taskId)}catch(e){showToast(e.message,true)}}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop());r.onerror=()=>reject(new Error('Gagal membaca file.'));r.readAsDataURL(file)})}
async function createResultDoc(taskId){try{await api('createResultDoc',{taskId});showToast('Google Docs hasil dibuat.');await showTaskDetail(taskId)}catch(e){showToast(e.message,true)}}
async function deleteAttachment(id){if(!confirm('Hapus lampiran ini?'))return;try{await api('deleteAttachment',{id});closeModal();showToast('Lampiran dihapus.')}catch(e){showToast(e.message,true)}}

function openLeaveForm(x={}){openModal(x.id?'Edit Cuti':'Catat Cuti',`<div class="form-grid"><div class="field full"><label>Anggota Tim *</label><select id="leavePic"><option value="">Pilih</option>${(state.bootstrap?.pics||[]).map(v=>`<option ${x.pic===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Tanggal Mulai *</label><input id="leaveStart" type="date" value="${esc(x.startDate||'')}"></div><div class="field"><label>Tanggal Selesai *</label><input id="leaveEnd" type="date" value="${esc(x.endDate||'')}"></div><div class="field full"><label>Catatan</label><textarea id="leaveNote">${esc(x.note||'')}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveLeave('${esc(x.id||'')}')">Simpan</button>`)}
async function saveLeave(id){try{await api('saveLeave',{id,pic:qs('#leavePic').value,startDate:qs('#leaveStart').value,endDate:qs('#leaveEnd').value,note:qs('#leaveNote').value});closeModal();showToast('Cuti disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deleteLeave(id){if(!confirm('Hapus data cuti?'))return;try{await api('deleteLeave',{id});showToast('Cuti dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}

function openDocumentForm(d={}){openModal(d.id?'Edit Dokumen':'Tambah Dokumen',`<div class="form-grid"><div class="field full"><label>Nama Dokumen *</label><input id="dName" value="${esc(d.name||'')}"></div><div class="field"><label>Program *</label><select id="dProgram">${(state.bootstrap?.programs||[]).map(v=>`<option ${d.program===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Project</label><select id="dProject">${projectOptions(d.projectId||state.projectId||'')}</select><div class="helper">Opsional. Dokumen tetap berada di Inventaris dan otomatis muncul pada Project.</div></div><div class="field"><label>Tag *</label><input id="dTag" value="${esc(d.tag||'')}"></div><div class="field"><label>Label Link</label><input id="dLabel" value="${esc(d.linkLabel||'')}"></div><div class="field"><label>URL</label><input id="dUrl" value="${esc(d.url||'')}"></div><div class="field full"><label>Keterangan</label><textarea id="dNotes">${esc(d.notes||'')}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveDocument('${esc(d.id||'')}')">Simpan</button>`)}
async function saveDocument(id){try{await api('saveDocument',{id,name:qs('#dName').value,program:qs('#dProgram').value,projectId:qs('#dProject').value,tag:qs('#dTag').value,linkLabel:qs('#dLabel').value,url:qs('#dUrl').value,notes:qs('#dNotes').value});closeModal();showToast('Dokumen disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deleteDocument(id){if(!confirm('Hapus dokumen ini?'))return;try{await api('deleteDocument',{id});showToast('Dokumen dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}

function openPicForm(p={}){openModal(p.id?'Edit PIC':'Tambah PIC',`<div class="form-grid"><div class="field full"><label>Nama Instansi *</label><input id="pInst" value="${esc(p.namaInstansi||'')}"></div><div class="field"><label>Kategori *</label><select id="pCat">${['Kabupaten','Kota','Provinsi','Kementerian/Lembaga'].map(v=>`<option ${p.kategoriInstansi===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>PIC Yanlik</label><select id="pYan"><option value="">Pilih</option>${(state.bootstrap?.pics||[]).map(v=>`<option ${p.namaPicYanlik===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Nama PIC Instansi</label><input id="pName" value="${esc(p.namaPicInstansi||'')}"></div><div class="field"><label>Nomor HP</label><input id="pPhone" value="${esc(p.nomorHandphonePicInstansi||'')}"></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="savePic('${esc(p.id||'')}')">Simpan</button>`)}
async function savePic(id){try{await api('savePic',{id,namaInstansi:qs('#pInst').value,kategoriInstansi:qs('#pCat').value,namaPicYanlik:qs('#pYan').value,namaPicInstansi:qs('#pName').value,nomorHandphonePicInstansi:qs('#pPhone').value});closeModal();showToast('PIC disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deletePic(id){if(!confirm('Hapus data PIC?'))return;try{await api('deletePic',{id});showToast('PIC dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}

function openAppForm(a={}){openModal(a.id?'Edit Aplikasi':'Tambah Aplikasi',`<div class="form-grid"><div class="field full"><label>Nama Aplikasi *</label><input id="aName" value="${esc(a.name||'')}"></div><div class="field"><label>Singkatan/Icon *</label><input id="aShort" maxlength="5" value="${esc(a.shortName||'')}"></div><div class="field"><label>Program *</label><select id="aProgram">${(state.bootstrap?.programs||[]).map(v=>`<option ${a.program===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Kategori *</label><select id="aCategory">${(state.bootstrap?.appCategories||[]).map(v=>`<option ${a.category===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Badge</label><input id="aBadge" value="${esc(a.badge||'')}"></div><div class="field full"><label>Link Aplikasi *</label><input id="aUrl" value="${esc(a.url||'')}"></div><div class="field full"><label>Deskripsi</label><textarea id="aDesc">${esc(a.description||'')}</textarea></div><div class="field full"><label><input type="checkbox" id="aActive" ${a.active!==false?'checked':''}> Aktif</label></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveApp('${esc(a.id||'')}')">Simpan</button>`)}
async function saveApp(id){try{await api('saveApp',{id,name:qs('#aName').value,shortName:qs('#aShort').value,program:qs('#aProgram').value,category:qs('#aCategory').value,badge:qs('#aBadge').value,url:qs('#aUrl').value,description:qs('#aDesc').value,active:qs('#aActive').checked});closeModal();showToast('Aplikasi disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}

function openBlastForm(b={}){const pics=state.model.pics||[];openModal(b.id?'Edit Blast Project':'Project Baru',`<div class="form-grid"><div class="field full"><label>Nama Project *</label><input id="bName" value="${esc(b.namaProject||'')}"></div><div class="field"><label>Channel</label><select id="bChannel">${['WhatsApp','Email','WhatsApp + Email'].map(v=>`<option ${b.channel===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="bStatus">${['Draft','Aktif','Selesai'].map(v=>`<option ${b.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Pilih Instansi *</label><div style="max-height:220px;overflow:auto;border:1px solid var(--line);padding:8px;border-radius:7px">${pics.map(p=>`<label style="display:block;font-size:11px;margin:4px 0"><input type="checkbox" name="bPic" value="${esc(p.id)}"> ${esc(p.namaInstansi)} · ${esc(p.namaPicYanlik||'')}</label>`).join('')}</div></div><div class="field full"><label>Pesan WhatsApp</label><textarea id="bWa">${esc(b.whatsappMessage||'')}</textarea></div><div class="field full"><label>Subjek Email</label><input id="bSubject" value="${esc(b.emailSubject||'')}"></div><div class="field full"><label>Isi Email</label><textarea id="bEmail">${esc(b.emailBody||'')}</textarea></div></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveBlast('${esc(b.id||'')}')">Simpan</button>`)}
async function saveBlast(id){try{await api('saveBlast',{id,namaProject:qs('#bName').value,channel:qs('#bChannel').value,status:qs('#bStatus').value,selectedPicIds:qsa('input[name="bPic"]:checked').map(x=>x.value),whatsappMessage:qs('#bWa').value,emailSubject:qs('#bSubject').value,emailBody:qs('#bEmail').value});closeModal();showToast('Blast Project disimpan.');await loadPage()}catch(e){showToast(e.message,true)}}
async function deleteBlast(id){if(!confirm('Hapus Blast Project?'))return;try{await api('deleteBlast',{id});showToast('Blast Project dihapus.');await loadPage()}catch(e){showToast(e.message,true)}}
async function toggleRecipientSent(id,sent,projectId){try{await api('setBlastSent',{recipientId:id,sent});await viewBlast(projectId)}catch(e){showToast(e.message,true)}}
async function saveRecipientEmail(id,email){try{await api('saveBlastEmail',{recipientId:id,email});showToast('Email disimpan.')}catch(e){showToast(e.message,true)}}

async function init(){
  buildNav();
  try{state.bootstrap=await api('bootstrap');await loadPage()}
  catch(e){setError(e.message);qs('#page').innerHTML=`<div class="card"><div class="card-body"><strong>Frontend belum terhubung ke API.</strong><div class="sub" style="margin-top:6px">Pastikan Environment Variable Netlify bernama APPS_SCRIPT_URL dan nilainya adalah URL Apps Script yang berakhiran /exec.</div></div></div>`}
}
init();
</script>
</body>
</html>
